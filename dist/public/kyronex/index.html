<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>KYRONEX · Sélection des intelligences</title>
  <meta name="theme-color" content="#050608">
  <style>
    :root{--red:#ff2634;--red2:#ff6d72;--ink:#050608;--panel:#0c1015;--line:#3b151b;--blue:#b8cad8}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:var(--ink);color:#f5f8fb;font-family:"Arial Narrow",Arial,sans-serif;overflow-x:hidden}
    body{display:grid;place-items:center;padding:clamp(12px,3vw,42px);background:
      radial-gradient(ellipse at 50% -10%,#351015 0,transparent 48%),
      radial-gradient(ellipse at 50% 110%,#24080c 0,transparent 45%),#050608}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.26;background:
      linear-gradient(rgba(255,40,50,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,40,50,.08) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
    .shell{position:relative;width:min(1180px,100%);padding:clamp(20px,3.2vw,42px);border:1px solid #70232c;border-radius:24px;background:linear-gradient(145deg,#11161d,#07090d 48%,#10090c);box-shadow:0 0 0 5px #090b0e,0 0 35px rgba(255,0,20,.26),inset 0 0 35px #000}
    .shell:before{content:"";position:absolute;inset:10px;border:1px solid #202a34;border-radius:17px;pointer-events:none}
    .scanner{position:absolute;top:13px;left:50%;width:min(340px,45%);height:5px;transform:translateX(-50%);overflow:hidden;background:#170509;border-radius:5px;box-shadow:0 0 10px #f11}
    .scanner:after{content:"";position:absolute;top:0;left:-30%;width:30%;height:100%;background:linear-gradient(90deg,transparent,#fff,#f22,transparent);box-shadow:0 0 18px #f22;animation:scan 2.2s ease-in-out infinite alternate}
    @keyframes scan{to{left:100%}}
    header{text-align:center;border-bottom:1px solid #321319;padding:8px 0 18px;margin-bottom:20px}
    .brand{font-size:clamp(2rem,7vw,5.7rem);font-weight:900;letter-spacing:.18em;color:#f4f8fb;line-height:.9;text-shadow:0 0 8px #fff,0 0 28px #f22}
    .brand::first-letter{color:#ff3340}.subtitle{margin-top:12px;color:#aebdca;font-size:clamp(.65rem,1.4vw,1rem);letter-spacing:.35em;text-transform:uppercase}
    #ai-selector-label{text-align:center;color:#ff7378;font-size:clamp(.75rem,1.4vw,1rem);letter-spacing:.24em;text-transform:uppercase;margin:0 0 14px}
    #ai-selector{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .ai-sel-btn{position:relative;min-height:112px;padding:18px 14px 16px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#1a2027,#090b0e 58%,#161014);color:#dce7ef;text-align:left;cursor:pointer;touch-action:manipulation;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;box-shadow:inset 0 1px 0 #49515a,0 4px 12px #000}
    .ai-sel-btn:hover,.ai-sel-btn:focus-visible{transform:translateY(-2px);border-color:var(--accent);box-shadow:inset 0 0 15px var(--accent-dim),0 0 18px var(--accent-dim),0 7px 15px #000;outline:0}
    .ai-sel-btn:active{transform:translateY(2px) scale(.985);box-shadow:inset 0 0 18px var(--accent-dim),0 0 10px var(--accent)}
    .ai-sel-btn.active{border-color:var(--accent);background:linear-gradient(145deg,#2a1116,#0a0b0e 56%,#1b0c11);box-shadow:inset 0 0 24px var(--accent-dim),0 0 20px var(--accent-dim),0 0 0 1px var(--accent)}
    .ai-sel-btn.in-progress{opacity:.74}.ai-name{display:block;color:var(--accent);font-size:clamp(.82rem,1.55vw,1.2rem);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.ai-spec{display:block;margin-top:11px;color:#b5c4cf;font-size:clamp(.62rem,1vw,.82rem);line-height:1.35;letter-spacing:.05em}.ai-dot{position:absolute;right:14px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 11px var(--accent)}.ai-progress{display:block;margin-top:10px;color:#9aa7b1;font-size:.62rem;letter-spacing:.08em}
    .ai-sel-btn[data-ai=karr]{--accent:#ffb000;--accent-dim:rgba(255,176,0,.38)}.ai-sel-btn[data-ai=kitt]{--accent:#ff2a2a;--accent-dim:rgba(255,42,42,.42)}.ai-sel-btn[data-ai=skv3]{--accent:#54e6ff;--accent-dim:rgba(84,230,255,.32)}.ai-sel-btn[data-ai=karr_dadoo]{--accent:#00ff88;--accent-dim:rgba(0,255,136,.32)}.ai-sel-btn[data-ai=k4000]{--accent:#c56cff;--accent-dim:rgba(197,108,255,.32)}.ai-sel-btn[data-ai=pascal]{--accent:#5aa7ff;--accent-dim:rgba(90,167,255,.32)}.ai-sel-btn[data-ai=jo_knight_rider]{--accent:#e8ff54;--accent-dim:rgba(232,255,84,.28)}.ai-sel-btn[data-ai=herve_pascal_k]{--accent:#ff6fb7;--accent-dim:rgba(255,111,183,.32)}
    .actions{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}.action{min-height:52px;padding:13px 22px;border-radius:9px;border:1px solid #9c2832;background:#10090b;color:#fff;text-decoration:none;font-size:clamp(.72rem,1.25vw,1rem);font-weight:800;letter-spacing:.1em;cursor:pointer;transition:.16s;box-shadow:0 0 14px rgba(255,0,20,.3),inset 0 0 12px rgba(255,0,20,.18)}.action:hover,.action:focus-visible{background:#5d1019;box-shadow:0 0 25px #f22;outline:0}.action:active{transform:translateY(2px) scale(.98)}#connect-btn{display:none}#connect-btn.visible{display:inline-flex;align-items:center}.voice-status{width:100%;min-height:1.3em;text-align:center;color:#93a4b0;font:12px "Courier New",monospace;letter-spacing:.08em}.status{text-align:center;margin-top:16px;color:#c0ccd4;font:clamp(.65rem,1vw,.8rem) "Courier New",monospace;letter-spacing:.12em}.status.online{color:#55ffaf;text-shadow:0 0 9px #0f8}.status.offline{color:#ff7171}.status.checking{color:#ffbd66}.offline{display:none;text-align:center;margin-top:8px;color:#ff7777;font-size:.72rem}
    @media(max-width:850px){#ai-selector{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:22px 16px}.ai-sel-btn{min-height:104px}}
    @media(max-width:430px){body{padding:8px}.shell{border-radius:16px;padding:20px 10px}.shell:before{inset:6px;border-radius:11px}header{margin-bottom:16px}.subtitle{letter-spacing:.18em}.ai-sel-btn{min-height:98px;padding:14px 10px}.ai-spec{margin-top:8px}.ai-dot{right:10px;top:12px}.actions{gap:8px}.action{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <main class="shell" id="portal">
    <div class="scanner" aria-hidden="true"></div>
    <header><div class="brand">KYRONEX</div><div class="subtitle">Neural access portal · Sélection système</div></header>
    <div id="ai-selector-label">Sélectionnez l'intelligence à contacter</div>
    <section id="ai-selector" aria-label="Sélection des intelligences">
      <button class="ai-sel-btn active" data-ai="karr" onclick="_selectAI('karr')" onmouseenter="_playHover('karr')"><span class="ai-name">K.A.R.R.</span><span class="ai-spec">ORIN NX 16GB<br>QWEN 7B</span><span class="ai-dot"></span></button>
      <button class="ai-sel-btn" data-ai="kitt" onclick="_selectAI('kitt')" onmouseenter="_playHover('kitt')"><span class="ai-name">K.I.T.T.</span><span class="ai-spec">ORIN NANO 8GB<br>QWEN 3B</span><span class="ai-dot"></span></button>
      <button class="ai-sel-btn" data-ai="skv3" onclick="_selectAI('skv3')" onmouseenter="_playHover('skv3')"><span class="ai-name">SUPER K.I.T.T. V3</span><span class="ai-spec">AGX ORIN<br>FLAGSHIP</span><span class="ai-dot"></span></button>
      <button class="ai-sel-btn" data-ai="karr_dadoo" onclick="_selectAI('karr_dadoo')" onmouseenter="_playHover('karr_dadoo')"><span class="ai-name">KARR De Dadoo</span><span class="ai-spec">JETSON NANO ORIN NX 8GB</span><span class="ai-dot"></span></button>
      <button class="ai-sel-btn" data-ai="k4000" onclick="_selectAI('k4000')" onmouseenter="_playHover('k4000')"><span class="ai-name">K-4000</span><span class="ai-spec">KIRONEX K-4000<br>Frank — KR-95<br>NVIDIA JETSON ORIN NANO 8 GO<br>By Manix</span><span class="ai-dot"></span></button>
      <button class="ai-sel-btn" data-ai="pascal" onclick="_selectAI('pascal')" onmouseenter="_playHover('pascal')"><span class="ai-name">K.I.T.T. PASCAL</span><span class="ai-spec">ORIN NANO 8GB SUPER<br>NEMOTRON 3 NANO 4B</span><span class="ai-dot"></span></button>
      <button class="ai-sel-btn in-progress" data-ai="jo_knight_rider" onclick="_selectAI('jo_knight_rider')" onmouseenter="_playHover('jo_knight_rider')"><span class="ai-name">JO KNIGHT RIDER</span><span class="ai-spec">KYRONEX<br>NEURAL NODE</span><span class="ai-dot"></span><span class="ai-progress">EN COURS DE CRÉATION...</span></button>
      <button class="ai-sel-btn in-progress" data-ai="herve_pascal_k" onclick="_selectAI('herve_pascal_k')" onmouseenter="_playHover('herve_pascal_k')"><span class="ai-name">HERVÉ DE PASCAL-K.</span><span class="ai-spec">KYRONEX<br>NEURAL NODE</span><span class="ai-dot"></span><span class="ai-progress">EN COURS DE CRÉATION...</span></button>
    </section>
    <div class="actions"><a id="connect-btn" class="action" href="#" target="_blank" rel="noopener">ACCÉDER</a><button id="kitt-voice-btn" class="action" onclick="kittParle()">▶ KITT — DÉMO VOCALE</button><div id="kitt-voice-status" class="voice-status"></div></div>
    <div id="p-status" class="status checking">VÉRIFICATION DU SYSTÈME...</div><div id="offline-box" class="offline">Cette intelligence est momentanément hors ligne.</div>
  </main>
  <script>
  (function(){'use strict';
    var TUNNEL_URLS={kitt:'https://api.github.com/repos/on3egs/Kitt-franco-belge/contents/tunnel_kitt.json?ref=main',karr:'https://api.github.com/repos/on3egs/Kitt-franco-belge/contents/tunnel_karr.json?ref=main',skv3:'https://api.github.com/repos/on3egs/Kitt-franco-belge/contents/tunnel_skv3.json?ref=main',karr_dadoo:'https://api.github.com/repos/on3egs/Kitt-franco-belge/contents/tunnel_karr_dadoo.json?ref=main',k4000:'https://api.github.com/repos/on3egs/Kitt-franco-belge/contents/tunnel_k4000.json?ref=main',pascal:'https://api.github.com/repos/on3egs/Kitt-franco-belge/contents/tunnel_pascal.json?ref=main',jo_knight_rider:'https://api.github.com/repos/on3egs/Kitt-franco-belge/contents/tunnel_jo_knight_rider.json?ref=main',herve_pascal_k:'https://api.github.com/repos/on3egs/Kitt-franco-belge/contents/tunnel_herve_pascal_k.json?ref=main'};
    var active='karr',maxAge=120,hover={},hoverPlaying=false;
    var base='https://on3egs.github.io/Kitt-franco-belge/kyronex/';
    ['kitt','karr','skv3','karr_dadoo'].forEach(function(id){hover[id]=new Audio(base+'hover_'+id+'.mp3');hover[id].preload='auto'});['k4000','pascal','jo_knight_rider','herve_pascal_k'].forEach(function(id){hover[id]=new Audio(base+'hover_kitt.mp3');hover[id].preload='auto'});
    window._playHover=function(id){if(hoverPlaying||!hover[id])return;hoverPlaying=true;var a=hover[id];a.currentTime=0;a.play().catch(function(){});a.onended=function(){hoverPlaying=false}};
    function label(id){return id==='karr'?'K.A.R.R.':id==='skv3'?'SUPER K.I.T.T. V3':id==='karr_dadoo'?'KARR De Dadoo':id==='k4000'?'K-4000':id==='pascal'?'K.I.T.T. PASCAL':id==='jo_knight_rider'?'JO KNIGHT RIDER':id==='herve_pascal_k'?'HERVÉ DE PASCAL-K.':'K.I.T.T.'}
    window._selectAI=function(id){active=id;document.querySelectorAll('.ai-sel-btn').forEach(function(b){b.classList.toggle('active',b.dataset.ai===id)});var s=document.getElementById('p-status'),c=document.getElementById('connect-btn'),o=document.getElementById('offline-box'),name=label(id);s.className='status checking';s.textContent='CONNEXION À '+name+'...';c.classList.remove('visible');o.style.display='none';var url=TUNNEL_URLS[id],sep=url.indexOf('?')<0?'?':'&';fetch(url+sep+'t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github.raw+json'}}).then(function(r){return r.json()}).then(function(d){var age=(Date.now()-new Date(d.last_update).getTime())/60000;if(d.status!=='online'||!d.url||(!d.permanent&&age>maxAge))throw Error('offline');s.className='status online';s.textContent=name+' EN LIGNE — CONNEXION DISPONIBLE';c.href=d.url;c.textContent='ACCÉDER À '+name;c.classList.add('visible')}).catch(function(){s.className='status offline';s.textContent=name+' HORS LIGNE';o.style.display='block'})};
    window._checkTunnel=function(){window._selectAI(active)};window._selectAI('karr');
  })();
  </script>
  <script>
  var _kittAudio=null,_kittPlaying=false,_phraseIdx=0,KITT_PHRASES=["Bonjour. Je suis K.I.T.T., le Knight Industries Two Thousand, version Franco-Belge. Système en ligne. Intelligence artificielle activée. Prêt à l'action, Manix.","Attention. Anomalie détectée dans le secteur nord. Je recommande la plus grande prudence. Mes capteurs sont pleinement opérationnels.","Manix, toutes mes fonctions sont au maximum. Le turbo boost est prêt. Donnez-moi vos coordonnées, et je calcule l'itinéraire optimal.","Système de navigation activé. Vitesse de croisière : deux cent quarante kilomètres heure. Carrosserie renforcée en mode combat. K.I.T.T. est prêt.","Je suis K.I.T.T. Mon intelligence artificielle traite mille deux cents opérations par seconde. Ensemble, Manix, nous sommes invincibles."];
  function kittParle(){if(_kittPlaying)return;var b=document.getElementById('kitt-voice-btn'),s=document.getElementById('kitt-voice-status'),text=KITT_PHRASES[_phraseIdx++%KITT_PHRASES.length];_kittPlaying=true;b.textContent='TRANSMISSION EN COURS...';b.disabled=true;s.textContent='CONNEXION VOCALE...';fetch('https://karr.kitt-franco-belge.be/api/tts-eleven',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,model_id:'eleven_v3',voice_settings:{stability:.55,similarity_boost:.78,style:.25,use_speaker_boost:true}})}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.blob()}).then(function(blob){var url=URL.createObjectURL(blob);if(_kittAudio){_kittAudio.pause();URL.revokeObjectURL(_kittAudio.src)}_kittAudio=new Audio(url);_kittAudio.onplay=function(){s.textContent='KITT PARLE...'};_kittAudio.onended=function(){_kittPlaying=false;b.disabled=false;b.textContent='▶ KITT — DÉMO VOCALE';s.textContent='TRANSMISSION TERMINÉE'};_kittAudio.onerror=function(){throw Error('audio')};_kittAudio.play()}).catch(function(e){_kittPlaying=false;b.disabled=false;b.textContent='▶ KITT — DÉMO VOCALE';s.textContent='ERREUR AUDIO : '+e.message})}
  </script>
</body>
</html>
