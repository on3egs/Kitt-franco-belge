      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/kitt-blueprint.png" fetchpriority="high" />
    <meta property="og:title" content="KITT Franco-Belge — Kyronext System By Manix" />
    <meta property="og:description" content="L’univers Knight Rider : IA locale, communauté, Studio et Sentinel." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://kitt-franco-belge.be/kitt-blueprint.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>KITT FRANCO-BELGE — Système Central KYRONEX</title>
    <meta name="description" content="KITT Franco-Belge — Intelligence artificielle locale expérimentale sur architecture Jetson. Projet passionnel inspiré de K.I.T.T. (Knight Rider / K2000) par KITT Franco-Belge." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <script>
      (function(l) {
        var params = new URLSearchParams(l.search);
        if (!params.has('p')) return;
        var route = params.get('p') || '/';
        var query = params.get('q') || '';
        var base = l.pathname.replace(/\/$/, '');
        var target = new URL(base + route.replace(/~and~/g, '&'), l.origin);
        if (target.origin !== l.origin) return;
        window.history.replaceState(null, null, target.pathname +
          (query ? '?' + query.replace(/~and~/g, '&') : '') + l.hash);
      }(window.location));
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const analyticsEndpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const analyticsWebsiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;

      if (analyticsEndpoint && analyticsWebsiteId) {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${analyticsEndpoint}/umami`;
        script.dataset.websiteId = analyticsWebsiteId;
        document.head.appendChild(script);
      }
    </script>
  </body>

</html>
