<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c12"><title>Chasse aux signaux — KITT Arcade</title>
<style>
:root{color-scheme:dark;--red:#ff334d;--cyan:#67ecff;--line:#263542}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#18343d 0,transparent 52%),linear-gradient(145deg,#080c12,#0b1018 65%,#160d13);color:#edf7fa;font:16px/1.5 system-ui,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}main{width:min(760px,100%);background:linear-gradient(150deg,#151f29ed,#0c1219f2);border:1px solid #354653;border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 25px 90px #0009,0 0 42px #ff334d14}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:.76rem;letter-spacing:.22em;color:var(--red);font-weight:800;text-transform:uppercase}h1{margin:.25em 0;font-size:clamp(1.7rem,5vw,2.7rem);line-height:1.1}p{color:#b9c9d1}.back{color:var(--cyan);text-decoration:none;border:1px solid #36505c;border-radius:999px;padding:9px 14px;white-space:nowrap}.back:hover{background:#16303a}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stat{background:#080e14;border:1px solid var(--line);border-radius:12px;padding:10px 15px;min-width:108px}.stat small{display:block;color:#8299a4;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem}.stat strong{font-variant-numeric:tabular-nums;font-size:1.2rem}.field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,16px);max-width:560px;margin:10px auto 0}.hole{aspect-ratio:1;border:1px solid #32424c;border-radius:50%;background:radial-gradient(ellipse at center,#020507 0 44%,#121d23 47% 58%,#26363b 62%,#0a1015 76%);box-shadow:inset 0 8px 18px #000b,0 6px 12px #0007;cursor:pointer;position:relative;overflow:hidden;touch-action:manipulation}.hole:before{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,#142128,#040709 72%)}.hole .target{position:absolute;inset:12%;display:grid;place-items:center;font-size:clamp(2rem,10vw,4.6rem);opacity:0;transform:translateY(45%) scale(.55);transition:opacity .11s,transform .15s;text-shadow:0 0 18px #ff324d;pointer-events:none}.hole.up .target{opacity:1;transform:translateY(-3%) scale(1)}.target::before{content:"◆";color:#ff3a59;font-size:.9em;filter:drop-shadow(0 0 12px #ff294f)}.hole:active{transform:scale(.97)}.hole:focus-visible,.back:focus-visible,button:focus-visible{outline:3px solid white;outline-offset:3px}.controls{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap}button.action{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,#ff334d,#b7102f);color:white;font-weight:800;cursor:pointer;box-shadow:0 7px 20px #ff334d3a}.message{text-align:center;min-height:1.6em;color:#8cf5dc;font-weight:650;margin:14px 0 4px}.hint{text-align:center;font-size:.88rem;color:#8398a3}@media(max-width:480px){body{padding:10px}main{border-radius:18px}.back{padding:8px 10px;font-size:.86rem}.field{gap:7px}.hole{border-width:2px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body><main><header><div><div class="brand">KITT Arcade · défense du tunnel</div><h1>Chasse aux signaux</h1></div><a class="back" href="../../index.html">← Arcade</a></header><p>Les échos rouges surgissent autour de la route. Touche-les avant qu'ils ne disparaissent !</p><div class="stats"><div class="stat"><small>Temps</small><strong id="time">30</strong></div><div class="stat"><small>Impacts</small><strong id="score">0</strong></div><div class="stat"><small>Record</small><strong id="best">0</strong></div></div><div class="field" id="field" role="group" aria-label="Neuf points à surveiller"></div><div id="message" class="message" role="status" aria-live="polite">Prêt ? Clique sur « Lancer la chasse ».</div><div class="controls"><button class="action" id="start">Lancer la chasse</button></div><div class="hint">30 secondes. Compatible souris et écran tactile.</div></main>
<script>
// Jeu rapide entièrement tactile/souris, avec record local.
const field=document.querySelector('#field'),holes=[],KEY='kitt-arcade-whack-best';let score=0,time=30,active=-1,running=false,tick=null,hide=null;document.querySelector('#best').textContent=localStorage.getItem(KEY)||'0';const message=document.querySelector('#message');
for(let i=0;i<9;i++){const b=document.createElement('button');b.type='button';b.className='hole';b.setAttribute('aria-label',`Point de contrôle ${i+1}`);b.innerHTML='<span class="target" aria-hidden="true"></span>';b.addEventListener('click',()=>hit(i));field.append(b);holes.push(b)}
function spawn(){if(!running)return;holes.forEach(h=>h.classList.remove('up'));let n=Math.floor(Math.random()*holes.length);if(n===active)n=(n+1+Math.floor(Math.random()*8))%holes.length;active=n;holes[n].classList.add('up');clearTimeout(hide);hide=setTimeout(()=>{holes[n].classList.remove('up');if(active===n)active=-1;spawn()},Math.max(420,1050-score*13))}
function hit(i){if(!running||i!==active)return;score++;active=-1;holes[i].classList.remove('up');document.querySelector('#score').textContent=score;const best=Number(localStorage.getItem(KEY)||0);if(score>best){localStorage.setItem(KEY,score);document.querySelector('#best').textContent=score}message.textContent=score%10===0?'Belle série ! Le tunnel est presque sûr.':'Impact confirmé !';clearTimeout(hide);setTimeout(spawn,100)}
function end(){running=false;clearInterval(tick);clearTimeout(hide);active=-1;holes.forEach(h=>h.classList.remove('up'));message.textContent=`Fin de la chasse : ${score} signal${score>1?'s':''} neutralisé${score>1?'s':''}.`;document.querySelector('#start').textContent='Rejouer'}
function start(){clearInterval(tick);clearTimeout(hide);holes.forEach(h=>h.classList.remove('up'));score=0;time=30;active=-1;running=true;document.querySelector('#score').textContent='0';document.querySelector('#time').textContent='30';document.querySelector('#start').textContent='Recommencer';message.textContent='Attention, ils arrivent !';spawn();tick=setInterval(()=>{time--;document.querySelector('#time').textContent=time;if(time<=0)end()},1000)}
document.querySelector('#start').addEventListener('click',start);
</script></body></html>
