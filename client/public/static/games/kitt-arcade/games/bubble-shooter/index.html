<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c12"><title>Nettoyage du tunnel — KITT Arcade</title>
<style>
:root{color-scheme:dark;--red:#ff334d;--cyan:#67ecff;--panel:#111923;--line:#263542}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#18343d 0,transparent 52%),linear-gradient(145deg,#080c12,#0b1018 65%,#160d13);color:#edf7fa;font:16px/1.5 system-ui,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}main{width:min(760px,100%);background:linear-gradient(150deg,#151f29ed,#0c1219f2);border:1px solid #354653;border-radius:24px;padding:clamp(15px,3vw,28px);box-shadow:0 25px 90px #0009,0 0 42px #ff334d14}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:.76rem;letter-spacing:.22em;color:var(--red);font-weight:800;text-transform:uppercase}h1{margin:.25em 0;font-size:clamp(1.6rem,5vw,2.5rem);line-height:1.1}p{color:#b9c9d1}.back{color:var(--cyan);text-decoration:none;border:1px solid #36505c;border-radius:999px;padding:9px 14px;white-space:nowrap}.back:hover{background:#16303a}.hud{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}.pill{background:#080e14;border:1px solid var(--line);border-radius:12px;padding:8px 13px}.pill small{color:#8299a4;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;display:block}.pill strong{font-size:1.1rem}.arena{display:grid;place-items:center}.frame{position:relative;width:min(100%,520px);border:1px solid #3c5360;border-radius:18px;padding:8px;background:#070d13;box-shadow:inset 0 0 35px #051b26,0 0 30px #67ecff16}canvas{width:100%;height:auto;display:block;border-radius:11px;background:linear-gradient(#0a1721,#101823 70%,#091119);touch-action:none;cursor:crosshair}.controls{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0 8px}button.action{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,#ff334d,#b7102f);color:white;font-weight:800;cursor:pointer;box-shadow:0 7px 20px #ff334d3a}.message{text-align:center;min-height:1.5em;color:#8cf5dc;font-weight:650}.hint{text-align:center;font-size:.88rem;color:#8398a3}.back:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-width:480px){body{padding:8px}main{border-radius:18px}.back{padding:8px 10px;font-size:.86rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body><main><header><div><div class="brand">KITT Arcade · tir de précision</div><h1>Nettoyage du tunnel</h1></div><a class="back" href="../../index.html">← Arcade</a></header><p>Regroupe trois bulles ou plus de même couleur pour dégager la route du convoi.</p><div class="hud"><div class="pill"><small>Score</small><strong id="score">0</strong></div><div class="pill"><small>Record</small><strong id="best">0</strong></div><div class="pill"><small>Prochain tir</small><strong id="next">—</strong></div></div><div class="arena"><div class="frame"><canvas id="canvas" width="520" height="600" aria-label="Terrain de bulles : vise et touche pour tirer"></canvas></div></div><div class="controls"><button id="start" class="action">Nouvelle partie</button></div><div id="message" class="message" role="status" aria-live="polite">Touche le terrain pour viser et tirer.</div><div class="hint">Souris ou doigt : vise, puis touche pour tirer. Les bulles rebondissent sur les côtés.</div></main>
<script>
// Jeu de bulles entièrement dessiné au Canvas, sans ressource externe.
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),W=520,H=600,R=17.5,ROW_H=30.5,LEFT=R,TOP=30,ROWS=16,COLS=15,colors=['#ff3955','#4cd9ff','#ffd34d','#ab7cff','#60e6a2'];const bestKey='kitt-arcade-bubble-best';let grid=[],shot=null,aim={x:260,y:170},score=0,shots=0,current=0,next=1,playing=true,ended=false,raf=0;document.querySelector('#best').textContent=localStorage.getItem(bestKey)||'0';
function colX(c,row){return LEFT+c*R*1.83+(row%2?R*.91:0)}function rowY(r){return TOP+r*ROW_H}function rnd(){return Math.floor(Math.random()*colors.length)}function makeRow(r){return Array.from({length:COLS},(_,c)=>Math.random()<.78?rnd():null)}
function fresh(){grid=Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,c)=>r<5&&Math.random()<.82?rnd():null));score=shots=0;current=rnd();next=rnd();playing=true;ended=false;shot=null;msg('Bonne route. Ne laisse pas le tunnel se remplir !');sync();draw()}
function msg(t){document.querySelector('#message').textContent=t}function sync(){document.querySelector('#score').textContent=score;document.querySelector('#next').textContent='●';document.querySelector('#next').style.color=colors[next];const best=Number(localStorage.getItem(bestKey)||0);if(score>best){localStorage.setItem(bestKey,score);document.querySelector('#best').textContent=score}}
function bubble(x,y,color,glow=true){ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);const g=ctx.createRadialGradient(x-R*.35,y-R*.45,R*.1,x,y,R);g.addColorStop(0,'#ffffff');g.addColorStop(.18,colors[color]);g.addColorStop(1,'#101722');ctx.fillStyle=g;ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle=colors[color];ctx.globalAlpha=.72;ctx.stroke();ctx.globalAlpha=1;if(glow){ctx.shadowBlur=13;ctx.shadowColor=colors[color];ctx.stroke();ctx.shadowBlur=0}}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#10212d');bg.addColorStop(1,'#0a1018');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ff334d55';ctx.setLineDash([7,8]);ctx.beginPath();ctx.moveTo(0,535);ctx.lineTo(W,535);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#a9bbc588';ctx.font='12px system-ui';ctx.fillText('LIMITE DU TUNNEL',12,527);grid.forEach((row,r)=>row.forEach((v,c)=>{if(v!==null)bubble(colX(c,r),rowY(r),v)}));ctx.beginPath();ctx.arc(W/2,H-29,10,0,Math.PI*2);ctx.fillStyle='#c3d2d8';ctx.fill();ctx.fillStyle=colors[current];ctx.shadowColor=colors[current];ctx.shadowBlur=15;ctx.beginPath();ctx.arc(W/2,H-29,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(W/2,H-29);ctx.lineTo(aim.x,aim.y);ctx.strokeStyle='#b7cbd355';ctx.lineWidth=2;ctx.stroke();if(shot)bubble(shot.x,shot.y,shot.color,false);ctx.fillStyle=colors[next];ctx.font='bold 13px system-ui';ctx.fillText('SUIVANT',W/2+29,H-24)}
function ptr(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}canvas.addEventListener('pointermove',e=>{aim=ptr(e);draw()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(!playing||ended)return;aim=ptr(e);if(!shot)fire()});
function fire(){let dx=aim.x-W/2,dy=aim.y-(H-29);if(dy> -25)dy=-25;const len=Math.hypot(dx,dy)||1;shot={x:W/2,y:H-29,vx:dx/len*430,vy:dy/len*430,color:current};animate()}
function animate(){cancelAnimationFrame(raf);let last=performance.now();function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;if(shot){const steps=5;for(let i=0;i<steps&&shot;i++){shot.x+=shot.vx*dt/steps;shot.y+=shot.vy*dt/steps;if(shot.x<R||shot.x>W-R)shot.vx*=-1;let hit=shot.y<=TOP+R;for(let r=0;r<ROWS&&!hit;r++)for(let c=0;c<COLS;c++)if(grid[r][c]!==null&&Math.hypot(colX(c,r)-shot.x,rowY(r)-shot.y)<R*1.83){hit=true;break}if(hit){placeShot();break}}draw();if(shot){raf=requestAnimationFrame(frame);return}}}raf=requestAnimationFrame(frame)}
function placeShot(){const b=shot;shot=null;let best=null,dist=Infinity;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===null){const d=Math.hypot(colX(c,r)-b.x,rowY(r)-b.y);if(d<dist){dist=d;best=[r,c]}}if(!best){finish(false);return}const [r,c]=best;grid[r][c]=b.color;const cluster=clusterAt(r,c);if(cluster.length>=3){for(const [y,x] of cluster)grid[y][x]=null;score+=cluster.length*10;const floating=dropFloating();score+=floating*15;msg(`Signal neutralisé : +${cluster.length*10} points.`)}else{shots++;if(shots%6===0){grid.pop();grid.unshift(makeRow(0));msg('Nouvelle rangée détectée : reste mobile !')}}current=next;next=rnd();sync();if(grid.some((row,y)=>row.some(v=>v!==null)&&row.some((v,c)=>v!==null&&rowY(y)+R>535))){finish(false);return}if(grid.every(row=>row.every(v=>v===null)))finish(true);draw()}
function neighbors(r,c){const even=r%2===0;return [[r,c-1],[r,c+1],[r-1,c+(even?-1:0)],[r-1,c+(even?0:1)],[r+1,c+(even?-1:0)],[r+1,c+(even?0:1)]].filter(([y,x])=>y>=0&&y<ROWS&&x>=0&&x<COLS)}function clusterAt(r,c){const color=grid[r][c],q=[[r,c]],seen=new Set([r+','+c]);for(let i=0;i<q.length;i++)for(const [y,x] of neighbors(...q[i])){const k=y+','+x;if(grid[y][x]===color&&!seen.has(k)){seen.add(k);q.push([y,x])}}return q}
function dropFloating(){const seen=new Set(),q=[];for(let c=0;c<COLS;c++)if(grid[0][c]!==null){q.push([0,c]);seen.add('0,'+c)}for(let i=0;i<q.length;i++)for(const [y,x] of neighbors(...q[i])){const k=y+','+x;if(grid[y][x]!==null&&!seen.has(k)){seen.add(k);q.push([y,x])}}let n=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]!==null&&!seen.has(r+','+c)){grid[r][c]=null;n++}return n}
function finish(win){ended=true;playing=false;cancelAnimationFrame(raf);msg(win?`Tunnel dégagé ! Score : ${score}.`:'Le convoi est bloqué. Nouvelle tentative ?');if(win)score+=100;sync();draw()}
document.querySelector('#start').addEventListener('click',fresh);fresh();
</script></body></html>
