<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c12"><title>Séquence du scanner — KITT Arcade</title>
<style>
:root{color-scheme:dark;--red:#ff334d;--cyan:#67ecff;--panel:#111923;--line:#263542}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#18343d 0,transparent 52%),linear-gradient(145deg,#080c12,#0b1018 65%,#160d13);color:#edf7fa;font:16px/1.5 system-ui,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}main{width:min(700px,100%);background:linear-gradient(150deg,#151f29ed,#0c1219f2);border:1px solid #354653;border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 25px 90px #0009,0 0 42px #ff334d14}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:.76rem;letter-spacing:.22em;color:var(--red);font-weight:800;text-transform:uppercase}h1{margin:.25em 0;font-size:clamp(1.7rem,5vw,2.7rem);line-height:1.1}p{color:#b9c9d1}.back{color:var(--cyan);text-decoration:none;border:1px solid #36505c;border-radius:999px;padding:9px 14px;white-space:nowrap}.back:hover{background:#16303a}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stat{background:#080e14;border:1px solid var(--line);border-radius:12px;padding:10px 15px;min-width:108px}.stat small{display:block;color:#8299a4;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem}.stat strong{font-variant-numeric:tabular-nums;font-size:1.2rem}.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:450px;margin:0 auto}.pad{aspect-ratio:1.25;border:1px solid #ffffff33;border-radius:20px;cursor:pointer;opacity:.72;transform:scale(.98);box-shadow:inset 0 0 24px #0005,0 8px 16px #0006;transition:filter .12s,transform .12s,opacity .12s;touch-action:manipulation}.pad:hover{opacity:.95}.pad:active,.pad.lit{opacity:1;filter:brightness(1.8);transform:scale(1);box-shadow:0 0 30px currentColor}.p0{background:#9a122e;color:#ff3856}.p1{background:#115783;color:#47c8ff}.p2{background:#78600a;color:#ffd44e}.p3{background:#286442;color:#62ed9e}.pad:focus-visible,.back:focus-visible,button:focus-visible{outline:3px solid white;outline-offset:3px}.controls{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}button.action{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,#ff334d,#b7102f);color:white;font-weight:800;cursor:pointer;box-shadow:0 7px 20px #ff334d3a}.message{text-align:center;min-height:1.6em;color:#8cf5dc;font-weight:650;margin:14px 0 4px}.hint{text-align:center;font-size:.88rem;color:#8398a3}@media(max-width:480px){body{padding:10px}main{border-radius:18px}.back{padding:8px 10px;font-size:.86rem}.pads{gap:8px}.pad{border-radius:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body><main><header><div><div class="brand">KITT Arcade · calibration</div><h1>Séquence du scanner</h1></div><a class="back" href="../../index.html">← Arcade</a></header><p>Observe la séquence lumineuse et reproduis-la dans le même ordre. Chaque réussite ajoute un signal.</p><div class="stats"><div class="stat"><small>Niveau</small><strong id="level">0</strong></div><div class="stat"><small>Record</small><strong id="best">0</strong></div></div><div class="pads" aria-label="Boutons de la séquence"><button class="pad p0" data-pad="0" aria-label="Rouge"></button><button class="pad p1" data-pad="1" aria-label="Bleu"></button><button class="pad p2" data-pad="2" aria-label="Jaune"></button><button class="pad p3" data-pad="3" aria-label="Vert"></button></div><div id="message" class="message" role="status" aria-live="polite">Appuie sur lancer pour calibrer le scanner.</div><div class="controls"><button id="start" class="action">Lancer la séquence</button></div><div class="hint">Active le son si tu le souhaites : chaque couleur a sa propre note synthétique.</div></main>
<script>
// Simon avec notes WebAudio générées localement, sans fichier sonore.
const pads=[...document.querySelectorAll('.pad')],tones=[392,523.25,659.25,783.99],KEY='kitt-arcade-simon-best';let seq=[],input=0,playing=false,showing=false,level=0,audio=null;const msg=document.querySelector('#message');document.querySelector('#best').textContent=localStorage.getItem(KEY)||'0';
function sound(i){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=tones[i];g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.12,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.26);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.28)}catch{}}
function flash(i,duration=360){const p=pads[i];p.classList.add('lit');sound(i);setTimeout(()=>p.classList.remove('lit'),duration)}
function start(){seq=[];level=0;input=0;playing=true;showing=true;document.querySelector('#level').textContent='0';msg.textContent='Observe bien les signaux…';seq.push(Math.floor(Math.random()*4));showSequence()}
function showSequence(){showing=true;let i=0;const delay=Math.max(330,650-level*18);const run=()=>{if(i>=seq.length){showing=false;input=0;msg.textContent='À toi de reproduire la séquence.';return}flash(seq[i++],Math.min(430,delay*.65));setTimeout(run,delay)};setTimeout(run,450)}
function tap(i){if(!playing||showing)return;flash(i,220);if(i!==seq[input]){playing=false;showing=false;msg.textContent=`Mauvais signal. Scanner calibré jusqu'au niveau ${level}.`;return}input++;if(input===seq.length){level++;document.querySelector('#level').textContent=level;const best=Number(localStorage.getItem(KEY)||0);if(level>best){localStorage.setItem(KEY,level);document.querySelector('#best').textContent=level}showing=true;msg.textContent='Signal validé. Niveau suivant…';setTimeout(()=>{if(playing){seq.push(Math.floor(Math.random()*4));showSequence()}},650)}}
pads.forEach((p,i)=>{p.addEventListener('click',()=>tap(i));p.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();pads[(i+1)%4].focus()}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();pads[(i+3)%4].focus()}})});document.querySelector('#start').addEventListener('click',start);
</script></main></body></html>
