<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c12">
<title>Mémoire du scanner — KITT Arcade</title>
<style>
:root{color-scheme:dark;--red:#ff334d;--cyan:#67ecff;--ink:#080c12;--panel:#111923;--line:#263542}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#18343d 0,transparent 52%),linear-gradient(145deg,#080c12,#0b1018 65%,#160d13);color:#edf7fa;font:16px/1.5 system-ui,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}main{width:min(760px,100%);background:linear-gradient(150deg,#151f29ed,#0c1219f2);border:1px solid #354653;border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 25px 90px #0009,0 0 42px #ff334d14}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:.76rem;letter-spacing:.22em;color:var(--red);font-weight:800;text-transform:uppercase}h1{margin:.25em 0;font-size:clamp(1.7rem,5vw,2.7rem);line-height:1.1}p{color:#b9c9d1}.back{color:var(--cyan);text-decoration:none;border:1px solid #36505c;border-radius:999px;padding:9px 14px;white-space:nowrap}.back:hover{background:#16303a}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stat{background:#080e14;border:1px solid var(--line);border-radius:12px;padding:10px 15px;min-width:108px}.stat small{display:block;color:#8299a4;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem}.stat strong{font-variant-numeric:tabular-nums;font-size:1.2rem}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,2vw,13px);max-width:540px;margin:0 auto}.card{aspect-ratio:1;border:1px solid #39505d;border-radius:15px;background:linear-gradient(145deg,#17242e,#0b1117);color:transparent;cursor:pointer;font-size:clamp(1.5rem,7vw,3rem);box-shadow:inset 0 0 20px #0008,0 5px 12px #0005;transition:transform .18s,border-color .18s,background .18s;touch-action:manipulation}.card::before{content:"✦";color:#536b77;font-size:.9em}.card[aria-pressed=true],.card.matched{background:linear-gradient(145deg,#2a3440,#13262a);border-color:var(--cyan);color:white;transform:translateY(-2px);box-shadow:0 0 20px #67ecff36}.card[aria-pressed=true]::before,.card.matched::before{content:none}.card.matched{border-color:#65edbe;box-shadow:0 0 18px #65edbe36}.card:focus-visible,.back:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}button.action{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,#ff334d,#b7102f);color:white;font-weight:800;cursor:pointer;box-shadow:0 7px 20px #ff334d3a}.message{text-align:center;min-height:1.6em;color:#8cf5dc;font-weight:650}.hint{text-align:center;font-size:.88rem;color:#8398a3}@media(max-width:480px){body{padding:10px}main{border-radius:18px}.back{padding:8px 10px;font-size:.86rem}.card{border-radius:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head>
<body><main><header><div><div class="brand">KITT Arcade · entraînement FLAG</div><h1>Mémoire du scanner</h1></div><a class="back" href="../../index.html">← Arcade</a></header><p>Retrouve les paires de signaux lumineux. Moins tu retournes de cartes, plus ton score grimpe.</p><div class="stats" aria-live="polite"><div class="stat"><small>Coups</small><strong id="moves">0</strong></div><div class="stat"><small>Temps</small><strong id="time">00:00</strong></div><div class="stat"><small>Score</small><strong id="score">0</strong></div><div class="stat"><small>Record</small><strong id="best">0</strong></div></div><div id="board" class="board" role="group" aria-label="Jeu de mémoire"></div><div class="controls"><button class="action" id="restart">Nouvelle partie</button></div><div id="message" class="message" role="status" aria-live="polite">Prêt pour le briefing, Michael ?</div><div class="hint">Clique ou touche deux cartes pour révéler leur signal.</div></main>
<script>
// Petit jeu de mémoire : tout le score reste sur cet appareil.
const symbols=['🔴','🔵','🟢','🟡','🟣','🟠','⚡','🚘'];let deck=[],first=null,lock=false,moves=0,matched=0,seconds=0,timer=null,score=0;
const board=document.querySelector('#board'),moveEl=document.querySelector('#moves'),timeEl=document.querySelector('#time'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),message=document.querySelector('#message');
const BEST='kitt-arcade-memory-best';bestEl.textContent=localStorage.getItem(BEST)||'0';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function formatTime(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function start(){clearInterval(timer);deck=shuffle([...symbols,...symbols]);first=null;lock=false;moves=matched=seconds=score=0;moveEl.textContent='0';scoreEl.textContent='0';timeEl.textContent='00:00';message.textContent='Briefing reçu. À toi de jouer !';board.replaceChildren();deck.forEach((symbol,i)=>{const b=document.createElement('button');b.className='card';b.type='button';b.dataset.symbol=symbol;b.setAttribute('aria-label',`Signal ${i+1}, face cachée`);b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>flip(b));board.append(b)});timer=setInterval(()=>{seconds++;timeEl.textContent=formatTime(seconds);updateScore()},1000)}
function updateScore(){score=Math.max(0,1000-moves*22-seconds*3);scoreEl.textContent=score}
function flip(card){if(lock||card.classList.contains('matched')||card===first)return;card.textContent=card.dataset.symbol;card.setAttribute('aria-label',`Signal ${card.dataset.symbol}`);card.setAttribute('aria-pressed','true');if(!first){first=card;return}moves++;moveEl.textContent=moves;const a=first;first=null;if(a.dataset.symbol===card.dataset.symbol){a.classList.add('matched');card.classList.add('matched');a.setAttribute('aria-pressed','false');card.setAttribute('aria-pressed','false');matched+=2;updateScore();if(matched===deck.length){clearInterval(timer);score=Math.max(1,score);scoreEl.textContent=score;const best=Number(localStorage.getItem(BEST)||0);if(score>best){localStorage.setItem(BEST,score);bestEl.textContent=score;message.textContent='Nouveau record ! Même KITT est impressionné.'}else message.textContent=`Paires sécurisées en ${formatTime(seconds)}. Bien joué !`}}else{lock=true;updateScore();setTimeout(()=>{for(const c of [a,card]){c.textContent='';c.setAttribute('aria-pressed','false');c.setAttribute('aria-label','Signal, face cachée')}lock=false},750)}}
document.querySelector('#restart').addEventListener('click',start);start();
</script></body></html>
