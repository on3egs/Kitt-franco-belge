<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c14"><title>Turbo Breakout — Arcade KITT</title><style>
:root{color-scheme:dark;--bg:#090c14;--panel:#111827;--line:#283447;--red:#ff304d;--cyan:#56e5ff;--text:#edf3ff;--muted:#9ba9bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1b2336,#090c14 62%);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.shell{width:min(100%,780px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#121927ee,#0b101bee);box-shadow:0 20px 70px #0008,0 0 42px #ff304d14;padding:clamp(16px,4vw,30px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.eye{width:44px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 20px var(--red);animation:pulse 2s infinite}h1{font-size:clamp(1.3rem,4vw,2rem);margin:0}.sub{color:var(--muted);font-size:.9rem}.stats{display:flex;gap:10px}.stat{min-width:76px;border:1px solid var(--line);background:#0a0f18;border-radius:12px;padding:7px 11px;text-align:center}.stat small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}.stat b{font-size:1.1rem;font-variant-numeric:tabular-nums}canvas{display:block;width:100%;height:auto;aspect-ratio:720/480;border:1px solid #344359;border-radius:16px;background:#080d14;touch-action:none}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}.hint{color:var(--muted);font-size:.9rem}button,a{font:inherit}button{border:1px solid #62313b;background:#28151d;color:var(--text);border-radius:12px;padding:10px 16px;cursor:pointer}button:hover{border-color:var(--red);background:#3a1721}:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.touch{display:flex;justify-content:center;gap:10px;margin:14px 0}.touch button{min-width:100px}.back{color:var(--muted);text-decoration:none;font-size:.88rem}.back:hover{color:var(--cyan)}@keyframes pulse{50%{opacity:.58;box-shadow:0 0 8px var(--red)}}@media(max-width:620px){body{padding:10px}.shell{border-radius:18px}.hint{font-size:.82rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="shell"><header><div class="brand"><span class="eye" aria-hidden="true"></span><div><h1>Turbo Breakout</h1><div class="sub">Dégage la route, détruis les balises</div></div></div><div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Vies</small><b id="lives">3</b></div><div class="stat"><small>Record</small><b id="best">0</b></div></div></header><canvas id="field" width="720" height="480" aria-label="Casse-briques Turbo Breakout"></canvas><div class="bar"><span id="status" class="hint">Déplace la raquette, puis lance la balle.</span><button id="start">Lancer</button></div><div class="touch"><button id="left" aria-label="Raquette à gauche">◀</button><button id="launch">Lancer la balle</button><button id="right" aria-label="Raquette à droite">▶</button></div><div class="bar"><span class="hint">← → ou Q/D · souris/doigt · espace pour lancer</span><a class="back" href="../../index.html">← Retour à l’arcade KITT</a></div></main><script src="../../arcade-ambience.js?v=kitt-arcade-audio-20261029"></script><script>
(()=>{'use strict';const c=document.querySelector('#field'),g=c.getContext('2d'),W=720,H=480,key='kittArcade.breakout.best';let best=Number(localStorage.getItem(key)||0),paddle={x:W/2,w:112},ball={x:W/2,y:H-42,vx:3.4,vy:-4,r:8,stuck:true},bricks=[],score=0,lives=3,playing=false,last=0,raf;document.querySelector('#best').textContent=best;function level(){bricks=[];const colors=['#ff304d','#ff7855','#ffc457','#56e5ff'];for(let row=0;row<5;row++)for(let col=0;col<10;col++)bricks.push({x:42+col*64,y:62+row*31,w:54,h:19,alive:true,color:colors[row%colors.length]})}function draw(){g.clearRect(0,0,W,H);g.fillStyle='#0a101a';g.fillRect(0,0,W,H);for(const b of bricks)if(b.alive){g.save();g.fillStyle=b.color;g.shadowColor=b.color;g.shadowBlur=10;g.beginPath();g.roundRect(b.x,b.y,b.w,b.h,5);g.fill();g.restore()}g.save();g.fillStyle='#d7f7ff';g.shadowColor='#56e5ff';g.shadowBlur=16;g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill();g.fillStyle='#56e5ff';g.beginPath();g.roundRect(paddle.x-paddle.w/2,H-24,paddle.w,12,6);g.fill();g.restore();document.querySelector('#score').textContent=score;document.querySelector('#lives').textContent=lives}function resetBall(){ball={x:paddle.x,y:H-42,vx:(Math.random()-.5)*3+2,vy:-4.3,r:8,stuck:true}}function launch(){if(!playing){playing=true;last=performance.now();document.querySelector('#start').textContent='Recommencer';document.querySelector('#status').textContent='Restez mobile : certains blocs demandent plusieurs passages.';raf=requestAnimationFrame(loop)}if(ball.stuck)ball.stuck=false}function finish(won){playing=false;cancelAnimationFrame(raf);document.querySelector('#status').textContent=won?'Route dégagée ! Excellent pilotage.':'KITT doit retourner au garage. Recommencez quand vous voulez.';document.querySelector('#start').textContent='Rejouer';if(score>best){best=score;localStorage.setItem(key,best);document.querySelector('#best').textContent=best}}function loop(t){if(!playing)return;const dt=Math.min((t-last)/16.67||1,2);last=t;if(!ball.stuck){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);if(ball.y>H-34&&ball.y<H-14&&Math.abs(ball.x-paddle.x)<paddle.w/2+ball.r&&ball.vy>0){ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-paddle.x)*.07}for(const b of bricks)if(b.alive&&ball.x>b.x-ball.r&&ball.x<b.x+b.w+ball.r&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){b.alive=false;score+=10;ball.vy*=-1;break}if(ball.y>H+ball.r){lives--;if(lives<=0){draw();finish(false);return}resetBall()}if(bricks.every(b=>!b.alive)){score+=100;level();resetBall();document.querySelector('#status').textContent='Secteur nettoyé ! Nouveau niveau, balle plus rapide.';ball.vx*=1.18;ball.vy*=1.18}}else{ball.x=paddle.x}draw();raf=requestAnimationFrame(loop)}function start(){score=0;lives=3;paddle.x=W/2;level();resetBall();playing=false;draw();launch()}function move(x){paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,x));if(ball.stuck)ball.x=paddle.x}function canvasX(clientX){const r=c.getBoundingClientRect();return(clientX-r.left)*W/r.width}document.querySelector('#start').addEventListener('click',start);document.querySelector('#launch').addEventListener('click',launch);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||'qa'.includes(e.key.toLowerCase())){e.preventDefault();move(paddle.x-38)}if(e.key==='ArrowRight'||'d'.includes(e.key.toLowerCase())){e.preventDefault();move(paddle.x+38)}if(e.code==='Space'){e.preventDefault();launch()}});c.addEventListener('pointermove',e=>move(canvasX(e.clientX)));c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);move(canvasX(e.clientX));launch()});document.querySelector('#left').addEventListener('pointerdown',()=>move(paddle.x-45));document.querySelector('#right').addEventListener('pointerdown',()=>move(paddle.x+45));level();draw()})();
</script><script src="/site-assets/page-navigation.js" defer></script>
</body></html>
