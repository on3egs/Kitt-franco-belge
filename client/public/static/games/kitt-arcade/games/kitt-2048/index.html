<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c14"><title>KITT 2048 — Arcade KITT</title><style>
:root{color-scheme:dark;--bg:#090c14;--panel:#111827;--line:#283447;--red:#ff304d;--cyan:#56e5ff;--text:#edf3ff;--muted:#9ba9bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1b2336,#090c14 62%);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.shell{width:min(100%,600px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#121927ee,#0b101bee);box-shadow:0 20px 70px #0008,0 0 42px #ff304d14;padding:clamp(16px,4vw,30px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.eye{width:44px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 20px var(--red);animation:pulse 2s infinite}h1{font-size:clamp(1.4rem,5vw,2rem);margin:0}.sub{color:var(--muted);font-size:.9rem}.stats{display:flex;gap:8px}.stat{min-width:75px;border:1px solid var(--line);background:#0a0f18;border-radius:12px;padding:7px 10px;text-align:center}.stat small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}.stat b{font-size:1.05rem;font-variant-numeric:tabular-nums}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:10px;border:1px solid #344359;border-radius:16px;background:#080d14;touch-action:none;user-select:none}.tile{aspect-ratio:1;border:1px solid #263347;border-radius:11px;background:#111b2a;display:grid;place-items:center;font-size:clamp(1.15rem,7vw,2.25rem);font-weight:850;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px #ffffff12;transition:background .12s,transform .12s,color .12s}.tile[data-v="2"]{background:#263345}.tile[data-v="4"]{background:#31405b}.tile[data-v="8"]{background:#744c2b;color:#fff0d9}.tile[data-v="16"]{background:#a7502c}.tile[data-v="32"]{background:#ca3c45}.tile[data-v="64"]{background:#ff304d;box-shadow:0 0 15px #ff304d45}.tile[data-v="128"],.tile[data-v="256"]{background:#b79032;color:#fff5c4}.tile[data-v="512"],.tile[data-v="1024"],.tile[data-v="2048"]{background:#4bbdd0;color:#061018;box-shadow:0 0 18px #56e5ff5c}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;flex-wrap:wrap}.hint{color:var(--muted);font-size:.88rem}button,a{font:inherit}.action{border:1px solid #62313b;background:#28151d;color:var(--text);border-radius:11px;padding:9px 13px;cursor:pointer}.action:hover{border-color:var(--red);background:#3a1721}:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,43px);gap:5px;justify-content:center;margin:14px auto}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.back{color:var(--muted);text-decoration:none;font-size:.88rem}.back:hover{color:var(--cyan)}@keyframes pulse{50%{opacity:.58;box-shadow:0 0 8px var(--red)}}@media(max-width:520px){body{padding:10px}.shell{border-radius:18px}.board{gap:6px;padding:7px}.tile{border-radius:8px}.hint{font-size:.8rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="shell"><header><div class="brand"><span class="eye" aria-hidden="true"></span><div><h1>KITT 2048</h1><div class="sub">Fusionnez les modules de la voiture</div></div></div><div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Record</small><b id="best">0</b></div></div></header><div id="board" class="board" role="grid" aria-label="Grille de fusion 2048"></div><div class="bar"><span id="status" class="hint" aria-live="polite">Fusionnez deux mêmes modules jusqu’au 2048.</span><button class="action" id="undo">Annuler</button><button class="action" id="new">Nouvelle partie</button></div><nav class="pad" aria-label="Commandes tactiles"><button class="action" data-move="up" aria-label="Haut">▲</button><button class="action" data-move="left" aria-label="Gauche">◀</button><button class="action" data-move="down" aria-label="Bas">▼</button><button class="action" data-move="right" aria-label="Droite">▶</button></nav><div class="bar"><span class="hint">Flèches · ZQSD · WASD · glissez sur la grille</span><a class="back" href="../../index.html">← Retour à l’arcade KITT</a></div></main><script>
(()=>{'use strict';const board=document.querySelector('#board'),bestKey='kittArcade.2048.best';let grid,score,best=Number(localStorage.getItem(bestKey)||0),previous=null,won=false,over=false,touch=null;function empty(){return Array.from({length:4},()=>Array(4).fill(0))}function spawn(){const cells=[];grid.forEach((r,y)=>r.forEach((v,x)=>{if(!v)cells.push([x,y])}));if(!cells.length)return;const [x,y]=cells[Math.floor(Math.random()*cells.length)];grid[y][x]=Math.random()<.9?2:4}function render(){board.replaceChildren();grid.flat().forEach((v,i)=>{const cell=document.createElement('div');cell.className='tile';cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',v?String(v):'Vide');cell.dataset.v=v||0;cell.textContent=v||'';board.append(cell)});document.querySelector('#score').textContent=score;document.querySelector('#best').textContent=best}function fresh(){grid=empty();score=0;previous=null;won=false;over=false;spawn();spawn();document.querySelector('#status').textContent='Fusionnez les mêmes nombres. La partie est sauvegardée localement.';render()}function lineMove(line){const a=line.filter(Boolean);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];if(a[i]===2048&&!won){won=true;document.querySelector('#status').textContent='2048 atteint ! Vous pouvez continuer à jouer.'}a.splice(i+1,1)}while(a.length<4)a.push(0);return a}function move(dir){if(over)return;const before=JSON.stringify({grid,score,won});let n=grid.map(r=>r.slice());if(dir==='left'||dir==='right'){n=n.map(r=>lineMove(dir==='right'?r.slice().reverse():r).map((v,i,a)=>dir==='right'?a[3-i]:v))}else{for(let x=0;x<4;x++){let col=n.map(r=>r[x]);if(dir==='down')col.reverse();col=lineMove(col);if(dir==='down')col.reverse();for(let y=0;y<4;y++)n[y][x]=col[y]}}if(JSON.stringify(n)===JSON.stringify(grid))return;previous=before;grid=n;spawn();if(score>best){best=score;localStorage.setItem(bestKey,best)}if(!movesAvailable()){over=true;document.querySelector('#status').textContent='Plus de mouvement possible. Lancez une nouvelle partie.'}render()}function movesAvailable(){if(grid.some(r=>r.includes(0)))return true;for(let y=0;y<4;y++)for(let x=0;x<4;x++)if((x<3&&grid[y][x]===grid[y][x+1])||(y<3&&grid[y][x]===grid[y+1][x]))return true;return false}function undo(){if(!previous)return;const p=JSON.parse(previous);grid=p.grid;score=p.score;won=p.won;previous=null;over=false;document.querySelector('#status').textContent='Dernier mouvement annulé.';render()}document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={ArrowUp:'up',z:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',q:'left',a:'left',ArrowRight:'right',d:'right'};if(m[e.key]||m[k]){e.preventDefault();move(m[e.key]||m[k])}});document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.move)));document.querySelector('#new').addEventListener('click',fresh);document.querySelector('#undo').addEventListener('click',undo);board.addEventListener('pointerdown',e=>{touch=[e.clientX,e.clientY];board.setPointerCapture(e.pointerId)});board.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch[0],dy=e.clientY-touch[1];if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');touch=null});fresh()})();
</script></body></html>
