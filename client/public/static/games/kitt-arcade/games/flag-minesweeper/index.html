<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c14"><title>Démineur FLAG — Arcade KITT</title><style>
:root{color-scheme:dark;--bg:#090c14;--panel:#111827;--line:#283447;--red:#ff304d;--cyan:#56e5ff;--text:#edf3ff;--muted:#9ba9bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1b2336,#090c14 62%);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.shell{width:min(100%,720px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#121927ee,#0b101bee);box-shadow:0 20px 70px #0008,0 0 42px #ff304d14;padding:clamp(16px,4vw,30px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.eye{width:44px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 20px var(--red);animation:pulse 2s infinite}h1{font-size:clamp(1.25rem,4vw,1.9rem);margin:0}.sub{color:var(--muted);font-size:.9rem}.stats{display:flex;gap:8px}.stat{min-width:70px;border:1px solid var(--line);background:#0a0f18;border-radius:12px;padding:6px 9px;text-align:center}.stat small{display:block;color:var(--muted);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}.stat b{font-size:1rem;font-variant-numeric:tabular-nums}#board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;padding:8px;border:1px solid #344359;border-radius:14px;background:#080d14}.cell{aspect-ratio:1;padding:0;border:1px solid #314056;border-radius:5px;background:linear-gradient(145deg,#26364a,#172334);color:#f3f7ff;font-weight:800;font-size:clamp(.62rem,2vw,.95rem);display:grid;place-items:center;cursor:pointer;min-width:0;box-shadow:inset 0 1px #ffffff12}.cell:hover{border-color:var(--cyan)}.cell.open{background:#0d1420;border-color:#1d2939;box-shadow:none}.cell.flag{color:#ff536b}.cell.bomb{background:#4b1823;color:#fff}.n1{color:#58dcff}.n2{color:#6fe0a3}.n3{color:#ff657b}.n4{color:#b5a4ff}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;flex-wrap:wrap}.hint{color:var(--muted);font-size:.88rem}button,a{font:inherit}.action{border:1px solid #62313b;background:#28151d;color:var(--text);border-radius:11px;padding:9px 13px;cursor:pointer}.action:hover{border-color:var(--red);background:#3a1721}.flagmode[aria-pressed=true]{border-color:#ff536b;background:#3a1420}:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.back{color:var(--muted);text-decoration:none;font-size:.88rem}.back:hover{color:var(--cyan)}@keyframes pulse{50%{opacity:.58;box-shadow:0 0 8px var(--red)}}@media(max-width:520px){body{padding:8px}.shell{padding:12px;border-radius:17px}#board{gap:2px;padding:5px}.cell{border-radius:3px}.stat{min-width:55px;padding:5px}.stats{gap:4px}.hint{font-size:.78rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="shell"><header><div class="brand"><span class="eye" aria-hidden="true"></span><div><h1>Démineur FLAG</h1><div class="sub">Sécurisez le périmètre de la Fondation</div></div></div><div class="stats"><div class="stat"><small>À marquer</small><b id="remaining">20</b></div><div class="stat"><small>Temps</small><b id="time">0:00</b></div><div class="stat"><small>Record</small><b id="best">—</b></div></div></header><div id="board" role="grid" aria-label="Champ de mines"></div><div class="bar"><span id="status" class="hint" aria-live="polite">Révélez une case. Le premier clic est toujours sûr.</span><button class="action" id="new">Nouvelle mission</button><button class="action flagmode" id="flagMode" aria-pressed="false">⚑ Mode drapeau</button></div><div class="bar"><span class="hint">Clic droit pour marquer · sur mobile, activez le mode drapeau.</span><a class="back" href="../../index.html">← Retour à l’arcade KITT</a></div></main><script src="../../arcade-ambience.js?v=kitt-arcade-audio-20261029"></script><script>
(()=>{'use strict';const N=12,BOMBS=20,board=document.querySelector('#board'),bestKey='kittArcade.minesweeper.bestSeconds';let cells=[],over=false,started=false,flags=0,revealed=0,seconds=0,clock=null,flagMode=false,best=Number(localStorage.getItem(bestKey)||0);function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function setup(){clearInterval(clock);clock=null;over=false;started=false;flags=0;revealed=0;seconds=0;flagMode=false;document.querySelector('#flagMode').setAttribute('aria-pressed','false');document.querySelector('#time').textContent='0:00';document.querySelector('#status').textContent='Révélez une case. Le premier clic est toujours sûr.';cells=Array.from({length:N*N},()=>({mine:false,open:false,flag:false,n:0}));let placed=0;while(placed<BOMBS){const i=Math.floor(Math.random()*cells.length);if(!cells[i].mine){cells[i].mine=true;placed++}}cells.forEach((c,i)=>{c.n=neighbors(i).filter(j=>cells[j].mine).length});draw()}function neighbors(i){const x=i%N,y=Math.floor(i/N),a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if((dx||dy)&&nx>=0&&ny>=0&&nx<N&&ny<N)a.push(ny*N+nx)}return a}function draw(){board.replaceChildren();cells.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='cell'+(c.open?' open':'')+(c.flag?' flag':'')+(c.mine&&over?' bomb':'');b.setAttribute('role','gridcell');b.setAttribute('aria-label',c.open?(c.mine?'MINE':c.n?c.n+' voisin(s)':'Case vide'):(c.flag?'Drapeau posé':'Case cachée'));if(c.flag)b.textContent='⚑';else if(c.open){if(c.mine)b.textContent='✹';else if(c.n){b.textContent=c.n;b.classList.add('n'+Math.min(c.n,4))}}b.addEventListener('click',()=>handle(i));b.addEventListener('contextmenu',e=>{e.preventDefault();mark(i)});board.append(b)});document.querySelector('#remaining').textContent=Math.max(0,BOMBS-flags)}function firstSafe(i){if(cells[i].mine){cells[i].mine=false;const free=cells.map((c,j)=>!c.mine&&j!==i?j:-1).filter(j=>j>=0);const j=free[Math.floor(Math.random()*free.length)];cells[j].mine=true}cells.forEach((c,j)=>c.n=neighbors(j).filter(k=>cells[k].mine).length)}function startClock(){if(started)return;started=true;clock=setInterval(()=>{seconds++;document.querySelector('#time').textContent=fmt(seconds)},1000)}function reveal(i){const c=cells[i];if(c.open||c.flag||over)return;c.open=true;revealed++;if(c.mine){over=true;clearInterval(clock);document.querySelector('#status').textContent='Mine détectée ! La Fondation vous offre une nouvelle tentative.';cells.forEach(x=>{if(x.mine)x.open=true});draw();return}if(c.n===0)neighbors(i).forEach(reveal);if(revealed===N*N-BOMBS){over=true;clearInterval(clock);document.querySelector('#status').textContent='Périmètre sécurisé en '+fmt(seconds)+' !';if(!best||seconds<best){best=seconds;localStorage.setItem(bestKey,best);document.querySelector('#best').textContent=fmt(best)}}}function handle(i){if(over)return;if(flagMode){mark(i);return}if(!started){firstSafe(i);startClock()}reveal(i);draw()}function mark(i){if(over||cells[i].open)return;cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;draw()}document.querySelector('#new').addEventListener('click',setup);document.querySelector('#flagMode').addEventListener('click',e=>{flagMode=!flagMode;e.currentTarget.setAttribute('aria-pressed',String(flagMode))});document.querySelector('#best').textContent=best?fmt(best):'—';setup()})();
</script></body></html>
