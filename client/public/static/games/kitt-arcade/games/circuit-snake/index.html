<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c14">
<title>Circuit Snake — Arcade KITT</title>
<style>
:root{color-scheme:dark;--bg:#090c14;--panel:#111827;--line:#283447;--red:#ff304d;--cyan:#56e5ff;--text:#edf3ff;--muted:#9ba9bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1b2336 0,#090c14 62%);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.shell{width:min(100%,780px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#121927ee,#0b101bee);box-shadow:0 20px 70px #0008,0 0 42px #ff304d14;padding:clamp(16px,4vw,30px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.eye{width:44px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 20px var(--red);animation:pulse 2s infinite}h1{font-size:clamp(1.3rem,4vw,2rem);margin:0;letter-spacing:.02em}.sub{color:var(--muted);font-size:.9rem}.stats{display:flex;gap:10px}.stat{min-width:76px;border:1px solid var(--line);background:#0a0f18;border-radius:12px;padding:7px 11px;text-align:center}.stat small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}.stat b{font-size:1.1rem;font-variant-numeric:tabular-nums}canvas{display:block;width:100%;height:auto;aspect-ratio:24/16;border:1px solid #344359;border-radius:16px;background:#080d14;touch-action:none}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}.hint{color:var(--muted);font-size:.9rem}button,a{font:inherit}button{border:1px solid #62313b;background:#28151d;color:var(--text);border-radius:12px;padding:10px 16px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}button:hover{border-color:var(--red);background:#3a1721}button:active{transform:scale(.96)}:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.mobile{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:6px;justify-content:center;margin:16px auto 0}.mobile button{padding:0;font-size:1.2rem}.mobile button:nth-child(1){grid-column:2}.mobile button:nth-child(2){grid-column:1;grid-row:2}.mobile button:nth-child(3){grid-column:2;grid-row:2}.mobile button:nth-child(4){grid-column:3;grid-row:2}.back{color:var(--muted);text-decoration:none;font-size:.88rem}.back:hover{color:var(--cyan)}@keyframes pulse{50%{opacity:.58;box-shadow:0 0 8px var(--red)}}@media(max-width:620px){body{padding:10px}.shell{border-radius:18px}.mobile{display:grid}.hint{font-size:.82rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="shell"><header><div class="brand"><span class="eye" aria-hidden="true"></span><div><h1>Circuit Snake</h1><div class="sub">La tournée nocturne de KITT</div></div></div><div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Record</small><b id="best">0</b></div></div></header><canvas id="board" width="720" height="480" aria-label="Terrain de jeu Circuit Snake"></canvas><div class="bar"><span class="hint" id="message">Attrape les balises cyan. Évite les murs et ta propre trace.</span><button id="start">Démarrer</button></div><nav class="mobile" aria-label="Commandes tactiles"><button data-dir="up" aria-label="Haut">▲</button><button data-dir="left" aria-label="Gauche">◀</button><button data-dir="down" aria-label="Bas">▼</button><button data-dir="right" aria-label="Droite">▶</button></nav><div class="bar"><span class="hint">Flèches · ZQSD · WASD · glisse sur le terrain</span><a class="back" href="../../index.html">← Retour à l’arcade KITT</a></div></main>
<script src="../../arcade-ambience.js?v=kitt-arcade-audio-20261029"></script><script>
(()=>{'use strict';const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),cols=24,rows=16,step=30;let snake,dir,next,food,timer,score=0,playing=false;const bestKey='kittArcade.snake.best';let best=Number(localStorage.getItem(bestKey)||0);document.querySelector('#best').textContent=best;function reset(){snake=[{x:7,y:8},{x:6,y:8},{x:5,y:8}];dir={x:1,y:0};next=dir;food={x:16,y:8};score=0;paint()}function placeFood(){do{food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function paint(){ctx.clearRect(0,0,720,480);ctx.strokeStyle='#151f2d';ctx.lineWidth=1;for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*step,0);ctx.lineTo(x*step,480);ctx.stroke()}for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*step);ctx.lineTo(720,y*step);ctx.stroke()}ctx.save();ctx.shadowColor='#56e5ff';ctx.shadowBlur=18;ctx.fillStyle='#56e5ff';ctx.beginPath();ctx.arc(food.x*step+15,food.y*step+15,8,0,Math.PI*2);ctx.fill();ctx.restore();snake.forEach((p,i)=>{ctx.save();ctx.fillStyle=i===0?'#ff304d':'#df263f';ctx.shadowColor=i===0?'#ff304d':'transparent';ctx.shadowBlur=i===0?16:0;ctx.beginPath();ctx.roundRect(p.x*step+2,p.y*step+2,26,26,7);ctx.fill();ctx.restore()});document.querySelector('#score').textContent=score}function end(){playing=false;clearInterval(timer);document.querySelector('#start').textContent='Rejouer';document.querySelector('#message').textContent='Fin de course ! Score : '+score+'. Relance pour reprendre la route.';if(score>best){best=score;localStorage.setItem(bestKey,best);document.querySelector('#best').textContent=best}}function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some(p=>p.x===head.x&&p.y===head.y)){end();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;placeFood()}else snake.pop();paint()}function begin(){reset();playing=true;document.querySelector('#message').textContent='Bien joué, pilote : garde le cap !';document.querySelector('#start').textContent='Recommencer';clearInterval(timer);timer=setInterval(tick,115)}const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};function turn(n){const d=dirs[n];if(d&&d.x!==-dir.x&&d.y!==-dir.y)next=d}document.addEventListener('keydown',e=>{const m={ArrowUp:'up',z:'up',Z:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',q:'left',Q:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(m[e.key]){e.preventDefault();turn(m[e.key])}if(e.key==='Enter'&&!playing)begin()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.dir)}));document.querySelector('#start').addEventListener('click',begin);let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});reset()})();
</script><script src="/site-assets/page-navigation.js" defer></script>
</body></html>
