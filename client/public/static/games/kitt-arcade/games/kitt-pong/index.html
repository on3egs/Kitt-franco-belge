<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c14"><title>KITT Pong — Arcade KITT</title><style>
:root{color-scheme:dark;--bg:#090c14;--panel:#111827;--line:#283447;--red:#ff304d;--cyan:#56e5ff;--text:#edf3ff;--muted:#9ba9bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1b2336,#090c14 62%);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.shell{width:min(100%,780px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#121927ee,#0b101bee);box-shadow:0 20px 70px #0008,0 0 42px #ff304d14;padding:clamp(16px,4vw,30px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.eye{width:44px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 20px var(--red);animation:pulse 2s infinite}h1{font-size:clamp(1.3rem,4vw,2rem);margin:0}.sub{color:var(--muted);font-size:.9rem}.stats{display:flex;gap:10px}.stat{min-width:76px;border:1px solid var(--line);background:#0a0f18;border-radius:12px;padding:7px 11px;text-align:center}.stat small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}.stat b{font-size:1.1rem;font-variant-numeric:tabular-nums}canvas{display:block;width:100%;height:auto;aspect-ratio:720/440;border:1px solid #344359;border-radius:16px;background:#080d14;touch-action:none}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}.hint{color:var(--muted);font-size:.9rem}button,a{font:inherit}button{border:1px solid #62313b;background:#28151d;color:var(--text);border-radius:12px;padding:10px 16px;cursor:pointer}button:hover{border-color:var(--red);background:#3a1721}:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.paddles{display:flex;justify-content:center;gap:24px;margin:14px 0}.paddles button{width:100px;height:48px;font-size:1.2rem}.back{color:var(--muted);text-decoration:none;font-size:.88rem}.back:hover{color:var(--cyan)}@keyframes pulse{50%{opacity:.58;box-shadow:0 0 8px var(--red)}}@media(max-width:620px){body{padding:10px}.shell{border-radius:18px}.hint{font-size:.82rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="shell"><header><div class="brand"><span class="eye" aria-hidden="true"></span><div><h1>KITT Pong</h1><div class="sub">Un duel de réflexes contre KARR</div></div></div><div class="stats"><div class="stat"><small>Michael</small><b id="playerScore">0</b></div><div class="stat"><small>KARR</small><b id="cpuScore">0</b></div></div></header><canvas id="arena" width="720" height="440" aria-label="Terrain de Pong contre KARR"></canvas><div class="bar"><span id="status" class="hint">Premier à 7 points. La balle se sert au centre.</span><button id="start">Lancer le duel</button></div><div class="paddles" aria-label="Commandes tactiles"><button id="up" aria-label="Déplacer la raquette vers le haut">▲</button><button id="down" aria-label="Déplacer la raquette vers le bas">▼</button></div><div class="bar"><span class="hint">Souris ou doigt sur le terrain · flèches · Z/S · W/S</span><a class="back" href="../../index.html">← Retour à l’arcade KITT</a></div></main><script src="../../arcade-ambience.js?v=kitt-arcade-audio-20261029"></script><script>
(()=>{'use strict';const c=document.querySelector('#arena'),g=c.getContext('2d'),W=720,H=440,store='kittArcade.pong.wins';let px=197,cy=0,bx=W/2,by=H/2,vx=5,vy=2.5,ps=0,cs=0,running=false,last=0,raf;let wins=Number(localStorage.getItem(store)||0);function resetBall(dir=1){bx=W/2;by=H/2;vx=dir*5;vy=(Math.random()-.5)*4}function paint(){g.clearRect(0,0,W,H);g.fillStyle='#0a101a';g.fillRect(0,0,W,H);g.setLineDash([9,12]);g.strokeStyle='#314054';g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();g.setLineDash([]);g.save();g.shadowBlur=18;g.shadowColor='#56e5ff';g.fillStyle='#56e5ff';g.fillRect(22,px-48,11,96);g.shadowColor='#ff304d';g.fillStyle='#ff304d';g.fillRect(W-33,cy-48,11,96);g.shadowColor='#fff';g.shadowBlur=14;g.fillStyle='#fff';g.beginPath();g.arc(bx,by,9,0,Math.PI*2);g.fill();g.restore();document.querySelector('#playerScore').textContent=ps;document.querySelector('#cpuScore').textContent=cs}function finish(){running=false;cancelAnimationFrame(raf);const won=ps>cs;document.querySelector('#status').textContent=(won?'Michael remporte le duel.':'KARR prend le point !')+' Victoires personnelles : '+wins+'.';document.querySelector('#start').textContent='Rejouer';if(won){wins++;localStorage.setItem(store,wins)}}function frame(t){if(!running)return;const dt=Math.min((t-last)/16.67||1,2);last=t;bx+=vx*dt;by+=vy*dt;if(by<10||by>H-10)vy*=-1;if(bx<42&&Math.abs(by-px)<57){vx=Math.abs(vx)*1.04;vy+=(by-px)*.055;bx=42}if(bx>W-42&&Math.abs(by-cy)<57){vx=-Math.abs(vx)*1.04;vy+=(by-cy)*.055;bx=W-42}cy+=(by-cy)*.075*dt;cy=Math.max(52,Math.min(H-52,cy));if(bx<0){cs++;if(cs>=7){paint();finish();return}resetBall(1)}if(bx>W){ps++;if(ps>=7){paint();finish();return}resetBall(-1)}paint();raf=requestAnimationFrame(frame)}function start(){ps=0;cs=0;px=H/2;cy=H/2;resetBall(Math.random()>.5?1:-1);running=true;last=performance.now();document.querySelector('#status').textContent='Premier à 7. Montrez à KARR ce que vaut un pilote.';document.querySelector('#start').textContent='Recommencer';cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}function move(y){px=Math.max(52,Math.min(H-52,y))}document.querySelector('#start').addEventListener('click',start);document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key.toLowerCase()==='z'||e.key.toLowerCase()==='w'){e.preventDefault();move(px-35)}if(e.key==='ArrowDown'||e.key.toLowerCase()==='s'){e.preventDefault();move(px+35)}if(e.key==='Enter'&&!running)start()});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||c.hasPointerCapture(e.pointerId)){const r=c.getBoundingClientRect();move((e.clientY-r.top)*H/r.height)}});c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();move((e.clientY-r.top)*H/r.height)});document.querySelector('#up').addEventListener('pointerdown',()=>move(px-35));document.querySelector('#down').addEventListener('pointerdown',()=>move(px+35));paint()})();
</script></body></html>
