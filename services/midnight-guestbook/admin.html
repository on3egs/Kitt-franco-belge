<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manix · Messages Midnight Disk</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c0813;color:#e4d9ed;font:14px/1.7 monospace}main{max-width:1060px;margin:auto;padding:32px 20px}h1{color:#ffdcaa;font-size:26px}p{color:#c0adce}input,button{font:inherit;padding:10px;background:#181021;color:#f1e1fb;border:1px solid #725082}button{cursor:pointer}input{width:min(100%,460px)}button:hover{background:#35213e}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0}article{border:1px solid #46324f;padding:22px;margin-bottom:16px;background:#15101c}article[data-hidden=true]{opacity:.6}.top{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}h2{font-size:17px;margin:0;color:#ffe0ae}.message{white-space:pre-wrap;overflow-wrap:anywhere;color:#e1d7e8}.badge{padding:3px 8px;background:#3a2449;color:#dec6ed;font-size:11px}.private{background:#253b2d;color:#d1f6cd}a{color:#b9dcff}.status{min-height:26px;color:#c8edc1}.meta{font-size:11px;color:#b6a2c2}label{color:#d8c1e4}.hidden{display:none}input:focus-visible,button:focus-visible{outline:2px solid #b4ffd4;outline-offset:3px}</style>
<main><p>MIDNIGHT DISK / ACCÈS MANIX</p><h1>Les signaux reçus.</h1><p>Les commentaires publics et les messages privés sont enregistrés ici. Masquer un message le retire de l’affichage ; vous pourrez le rétablir.</p>
<form id="login"><label>Votre clé d’accès privée<br><input id="key" type="password" required autocomplete="off"></label> <button>OUVRIR LA BOÎTE</button></form>
<div id="inbox" class="hidden"><div class="tools"><button id="refresh">ACTUALISER</button><label><input id="showHidden" type="checkbox" style="width:auto"> Voir les messages masqués</label><button id="logout">FERMER LA SESSION</button></div><div id="entries"></div></div><p id="status" class="status" role="status"></p></main>
<script>
let token=new URLSearchParams(location.hash.slice(1)).get('key')||'',rows=[];const $=id=>document.getElementById(id);history.replaceState(null,'',location.pathname);$('key').value=token;
function status(s){$('status').textContent=s}
async function api(path,method='GET'){const response=await fetch('/api/midnight/admin/entries'+path,{method,headers:{Authorization:'Bearer '+token}});let body;try{body=await response.json()}catch{throw Error('Le serveur est momentanément indisponible.')}if(!response.ok)throw Error(body.error||'Accès refusé.');return body}
function paint(){const container=$('entries');container.replaceChildren();const visible=rows.filter(r=>!r.hidden||$('showHidden').checked);if(!visible.length){const p=document.createElement('p');p.textContent='Aucun message à afficher pour le moment.';container.append(p)}for(const row of visible){const a=document.createElement('article');a.dataset.hidden=String(row.hidden);const top=document.createElement('div');top.className='top';const title=document.createElement('h2');title.textContent=row.author+(row.crew?' / '+row.crew:'');const badge=document.createElement('span');badge.className='badge'+(row.visibility==='private'?' private':'');badge.textContent=(row.visibility==='private'?'PRIVÉ':'PUBLIC')+(row.hidden?' / MASQUÉ':'');top.append(title,badge);const p=document.createElement('p');p.className='message';p.textContent=row.message;const meta=document.createElement('p');meta.className='meta';meta.textContent=new Date(row.created_at).toLocaleString('fr-FR');a.append(top,p,meta);if(row.email){const contact=document.createElement('a');contact.textContent='Répondre à '+row.email;contact.href='mailto:'+encodeURIComponent(row.email);a.append(contact,document.createElement('br'))}const button=document.createElement('button');button.textContent=row.hidden?'RÉTABLIR':'MASQUER';button.onclick=async()=>{button.disabled=true;try{await api('/'+row.id+(row.hidden?'/restore':''),row.hidden?'POST':'DELETE');await load()}catch(e){status(e.message)}finally{button.disabled=false}};a.append(button);container.append(a)}}
async function load(){status('Lecture des messages…');try{const data=await api('');rows=data.entries;$('login').classList.add('hidden');$('inbox').classList.remove('hidden');paint();status(rows.length+' message(s) chargé(s). Les 200 plus récents sont affichés.')}catch(e){status(e.message);$('login').classList.remove('hidden');$('inbox').classList.add('hidden')}}
$('login').onsubmit=e=>{e.preventDefault();token=$('key').value.trim();load()};$('refresh').onclick=load;$('showHidden').onchange=paint;$('logout').onclick=()=>{token='';rows=[];$('entries').replaceChildren();$('key').value='';$('inbox').classList.add('hidden');$('login').classList.remove('hidden');status('Session fermée.')};if(token)load();
</script></html>
