<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-4000 — Pascal Ferron</title>
<script src="/static/k4000-voice-display.js?v=20260730-5" defer></script>
<style>
:root {
  --c-red-primary: #ff0000;
  --c-red-bright: #ff2222;
  --c-red-dark: #880000;
  --c-bg-deep: #000000;
  --c-bg-panel: #0a0000;
  --c-bg-input: #110000;
  --c-text-primary: #ff0000;
  --c-text-secondary: #ff4444;
  --c-text-muted: #881111;
  --c-text-dim: #440000;
  --c-border: #330000;
  --c-border-bright: #660000;
  --font-mono: 'Courier New', monospace;
  --font-size-base: 14px;
  --transition: all 0.2s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: var(--font-size-base);
  background: var(--c-bg-deep);
  color: var(--c-text-primary);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Background gradient with subtle pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background: 
    radial-gradient(circle at 20% 30%, rgba(255,0,0,0.03) 1px, transparent 1px),
    radial-gradient(circle at 80% 70%, rgba(255,0,0,0.03) 1px, transparent 1px);
  background-size: 100px 100px, 150px 150px;
  pointer-events: none;
}

/* Header */
.header {
  text-align: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--c-border);
  background: linear-gradient(180deg, #000 0%, #0a0000 100%);
  box-shadow: 0 2px 10px rgba(255,0,0,0.6);
  position: relative;
  z-index: 100;
}

.header h1 {
  font-family: var(--font-mono);
  font-size: 1.8em;
  font-weight: bold;
  color: var(--c-red-bright);
  letter-spacing: 4px;
  margin-bottom: 4px;
}

.header .subtitle {
  font-family: var(--font-mono);
  font-size: 0.75em;
  color: var(--c-text-muted);
  letter-spacing: 2px;
}

.header .owner-badge {
  position: absolute;
  top: 12px;
  right: 20px;
  font-family: var(--font-mono);
  font-size: 11px;
  background: #110000;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid var(--c-border);
  color: var(--c-text-secondary);
  letter-spacing: 1px;
}

.mobile-menu-toggle {
  display: none;
  margin-top: 8px;
  padding: 6px 16px;
  border: 1px solid var(--c-border);
  border-radius: 4px;
  background: var(--c-bg-panel);
  color: var(--c-text-secondary);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: var(--transition);
}

.mobile-menu-toggle:hover {
  border-color: var(--c-red-primary);
  color: var(--c-red-bright);
}

.mobile-menu-toggle[aria-expanded="true"] {
  background: var(--c-red-dark);
  border-color: var(--c-red-primary);
  color: #ffffff;
}

/* Voice Display */
.voice-display-container {
  position: relative;
  z-index: 40;
  isolation: isolate;
  width: min(94vw, 1000px);
  margin: 0 auto 12px;
  border: 1px solid var(--c-red-primary);
  box-shadow: 0 0 22px rgba(255,0,0,0.52);
  flex: 0 0 auto;
  overflow: hidden;
  background: var(--c-bg-panel);
  pointer-events: none;
}

.voice-display-container k4000-voice-display { width: 100%; }

.display-fullscreen-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 42;
  width: 40px;
  height: 40px;
  border: 1px solid var(--c-red-bright);
  border-radius: 4px;
  color: var(--c-red-bright);
  background: var(--c-bg-input);
  box-shadow: 0 0 10px rgba(255,0,0,0.64);
  font-size: 20px;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: var(--transition);
}

.display-fullscreen-btn:hover {
  background: var(--c-red-dark);
  box-shadow: 0 0 15px rgba(255,0,0,0.8);
}

.voice-display-container:fullscreen,
.voice-display-container.pseudo-fullscreen,
.voice-display-container.orientation-fullscreen {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  max-width: none;
  margin: 0;
  border: 0;
  opacity: 1;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  background: var(--c-bg-deep);
  box-shadow: none;
}

.voice-display-container.pseudo-fullscreen,
.voice-display-container.orientation-fullscreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
}

.voice-display-container:fullscreen k4000-voice-display,
.voice-display-container.pseudo-fullscreen k4000-voice-display,
.voice-display-container.orientation-fullscreen k4000-voice-display {
  width: 100%;
  height: 100%;
  min-height: 0;
  max-height: none;
  aspect-ratio: auto;
  flex: 1 1 auto;
}

.voice-display-container.display-disabled { display: none !important; }

@media (max-width: 700px) {
  .voice-display-container { width: 100%; margin: 0; }
  .voice-display-container k4000-voice-display { min-height: 96px; max-height: 27dvh; }
}
@media (max-height: 560px) and (orientation: landscape) {
  .voice-display-container k4000-voice-display { max-height: 34dvh; min-height: 82px; }
  .voice-display-container.orientation-fullscreen k4000-voice-display { max-height: none; min-height: 0; }
}

/* Scanner KITT */
.scanner-container {
  display: flex;
  justify-content: center;
  padding: 16px 20px;
  flex: 0 0 auto;
}

.scanner {
  width: 300px;
  height: 10px;
  background: var(--c-bg-input);
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--c-border);
  box-shadow: 0 0 15px rgba(255,0,0,0.4);
}

.scanner-light {
  position: absolute;
  width: 70px;
  height: 100%;
  background: radial-gradient(ellipse, var(--c-red-bright) 0%, transparent 70%);
  border-radius: 6px;
  animation: scan 2s ease-in-out infinite;
  box-shadow: 0 0 25px var(--c-red-primary), 0 0 45px rgba(255,0,0,0.5);
}

.scanner.speaking .scanner-light {
  animation: scan-fast 0.6s ease-in-out infinite;
  background: radial-gradient(ellipse, #ff4444 0%, rgba(255,0,0,0.5) 40%, transparent 70%);
  box-shadow: 0 0 35px var(--c-red-primary), 0 0 65px rgba(255,0,0,0.7);
}

.scanner.listening .scanner-light {
  animation: scan-fast 0.8s ease-in-out infinite;
  background: radial-gradient(ellipse, #ff6600 0%, rgba(255,102,0,0.5) 40%, transparent 70%);
  box-shadow: 0 0 30px #ff4400, 0 0 55px rgba(255,69,0,0.6);
}

.scanner.auto-listening .scanner-light {
  animation: scan 3s ease-in-out infinite;
  background: radial-gradient(ellipse, #00cc00 0%, rgba(0,204,0,0.5) 40%, transparent 70%);
  box-shadow: 0 0 20px #00aa00, 0 0 40px rgba(0,170,0,0.4);
}

.scanner.auto-hearing .scanner-light {
  animation: scan-fast 0.5s ease-in-out infinite;
  background: radial-gradient(ellipse, #ff6600 0%, rgba(255,102,0,0.5) 40%, transparent 70%);
  box-shadow: 0 0 30px #ff4400, 0 0 55px rgba(255,69,0,0.6);
}

@keyframes scan {
  0%, 100% { left: 0; }
  50% { left: calc(100% - 70px); }
}

@keyframes scan-fast {
  0%, 100% { left: 0; }
  50% { left: calc(100% - 70px); }
}

/* Command Bar */
.command-bar {
  position: relative;
  z-index: 55;
  width: min(100%, 1000px);
  margin: 0 auto 10px;
  padding: 0 12px;
  display: grid;
  grid-template-columns: repeat(9, minmax(70px, 1fr));
  gap: 10px;
  flex: 0 0 auto;
}

.command-btn {
  min-height: 44px;
  border: 1px solid var(--c-border);
  border-radius: 6px;
  background: var(--c-bg-input);
  color: var(--c-text-secondary);
  font: bold 11px var(--font-mono);
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: inset 0 0 8px rgba(255,0,0,0.15);
  transition: var(--transition);
}

.command-btn:hover, .command-btn:focus-visible {
  color: #ffffff;
  border-color: var(--c-red-primary);
  box-shadow: 0 0 12px rgba(255,0,0,0.3);
  outline: none;
}

.command-btn.active {
  color: #ffffff;
  background: var(--c-red-dark);
  border-color: var(--c-red-bright);
  box-shadow: inset 0 0 12px rgba(255,0,0,0.4), 0 0 18px rgba(255,0,0,0.8);
}

.command-btn.mode-locked {
  color: #eaffea;
  border-color: #35ff62;
  background: rgba(0,90,24,0.78);
  box-shadow: inset 0 0 12px rgba(50,255,100,0.3), 0 0 18px rgba(0,255,70,0.75);
}

.mode-indicators {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin: -4px auto 12px;
  font: bold 11px var(--font-mono);
  letter-spacing: 1.5px;
  flex: 0 0 auto;
}

.mode-indicator {
  color: var(--c-text-dim);
}

.mode-indicator::before {
  content: '';
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 8px;
  border-radius: 50%;
  background: var(--c-bg-input);
  border: 1px solid var(--c-border);
  box-shadow: 0 0 4px var(--c-red-dark);
}

.mode-indicator.active {
  color: var(--c-red-bright);
}

.mode-indicator.active::before {
  background: var(--c-red-bright);
  border-color: var(--c-red-bright);
  box-shadow: 0 0 12px var(--c-red-bright);
}

/* Chat Area */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--c-border) var(--c-bg-deep);
}

.chat-area::-webkit-scrollbar {
  width: 8px;
}

.chat-area::-webkit-scrollbar-track {
  background: var(--c-bg-deep);
}

.chat-area::-webkit-scrollbar-thumb {
  background: var(--c-border);
  border-radius: 4px;
}

.chat-area::-webkit-scrollbar-thumb:hover {
  background: var(--c-border-bright);
}

.message {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: var(--font-size-base);
  line-height: 1.6;
  animation: fadeIn 0.3s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #220000 0%, #440000 100%);
  border: 1px solid var(--c-red-bright);
  color: #ffffff;
}

.message.kitt {
  align-self: flex-start;
  background: var(--c-bg-input);
  border: 1px solid var(--c-border);
  color: var(--c-text-primary);
}

.message .timing {
  font-size: 10px;
  color: var(--c-text-muted);
  margin-top: 6px;
  font-style: italic;
  font-family: var(--font-mono);
}

/* Input Area */
.input-area {
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  gap: 12px;
  align-items: flex-end;
  padding: 14px;
  background: var(--c-bg-panel);
  border: 1px solid var(--c-border);
  border-radius: 8px;
  z-index: 100;
  transition: var(--transition);
}

.input-area input {
  flex: 1;
  padding: 12px;
  background: var(--c-bg-input);
  border: 1px solid var(--c-border);
  border-radius: 6px;
  color: var(--c-text-primary);
  font-family: var(--font-mono);
  font-size: var(--font-size-base);
  outline: none;
  min-height: 44px;
  max-height: 120px;
  resize: none;
}

.input-area input::placeholder {
  color: var(--c-text-muted);
}

.input-area input:focus {
  border-color: var(--c-red-bright);
  box-shadow: 0 0 12px rgba(255,0,0,0.3);
}

.input-area button {
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  padding: 12px 16px;
  background: var(--c-bg-input);
  color: #ffffff;
  border: 1px solid var(--c-border);
  transition: var(--transition);
  white-space: nowrap;
}

.input-area button:hover:not(:disabled) {
  background: var(--c-red-primary);
  border-color: var(--c-red-bright);
  box-shadow: 0 0 12px rgba(255,0,0,0.4);
}

.input-area button:active:not(:disabled) {
  transform: scale(0.95);
}

.input-area button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Mic and Auto buttons */
.mic-btn, .auto-btn {
  width: 48px;
  height: 48px;
  padding: 0;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 2px solid var(--c-red-dark);
  background: var(--c-bg-input);
  color: var(--c-red-bright);
  cursor: pointer;
  transition: var(--transition);
  flex-shrink: 0;
}

.mic-btn:hover, .auto-btn:hover {
  background: var(--c-red-dark);
  border-color: var(--c-red-primary);
  box-shadow: 0 0 12px rgba(255,0,0,0.4);
}

.mic-btn.recording, .auto-btn.active {
  background: var(--c-red-primary);
  color: #ffffff;
  border-color: var(--c-red-bright);
  animation: mic-pulse 1s ease-in-out infinite;
  box-shadow: 0 0 18px rgba(255,0,0,0.6);
}

.auto-btn.active.waiting {
  background: #004400;
  border-color: #00aa00;
  color: #44ff44;
  animation: auto-pulse 2s ease-in-out infinite;
}

.auto-btn.active.hearing {
  background: var(--c-red-primary);
  border-color: var(--c-red-bright);
  color: white;
  animation: mic-pulse 0.5s ease-in-out infinite;
}

.mic-btn.transcribing, .auto-btn.transcribing {
  background: #553300;
  color: #ffaa44;
  border-color: #ff8800;
  animation: none;
}

@keyframes mic-pulse {
  0%, 100% { box-shadow: 0 0 10px rgba(255,0,0,0.4); }
  50% { box-shadow: 0 0 25px rgba(255,0,0,0.8); }
}

@keyframes auto-pulse {
  0%, 100% { box-shadow: 0 0 5px rgba(0,255,0,0.2); }
  50% { box-shadow: 0 0 15px rgba(0,255,0,0.4); }
}

/* Status Bar */
.status-bar {
  text-align: center;
  background: var(--c-bg-panel);
  backdrop-filter: blur(3px);
  padding: 6px;
  font-size: 0.75em;
  color: var(--c-text-muted);
  border-top: 1px solid var(--c-border);
  flex: 0 0 auto;
}

.status-bar .online { color: var(--c-red-bright); }
.status-bar .offline { color: #ff4444; }

/* Audio Controls */
.audio-controls {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  padding: 10px;
  flex-wrap: wrap;
  background: var(--c-bg-panel);
  border-top: 1px solid var(--c-border);
  backdrop-filter: blur(4px);
  flex: 0 0 auto;
}

.control-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.control-label {
  color: var(--c-text-muted);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-family: var(--font-mono);
}

.voice-selector {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.voice-btn, .effect-select {
  background: var(--c-bg-input);
  border: 1px solid var(--c-border);
  color: var(--c-text-secondary);
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  font: 12px var(--font-mono);
  transition: var(--transition);
}

.voice-btn:hover, .effect-select:hover {
  border-color: var(--c-red-primary);
  color: #ffffff;
  box-shadow: 0 0 8px rgba(255,0,0,0.3);
}

.voice-btn.active {
  background: var(--c-red-dark);
  border-color: var(--c-red-bright);
  color: #ffffff;
  box-shadow: 0 0 12px rgba(255,0,0,0.5);
}

.effect-select {
  background: var(--c-bg-input);
  color: var(--c-text-secondary);
  padding: 6px 10px;
  cursor: pointer;
}

/* System Panels */
.system-panel {
  position: fixed;
  inset: 0;
  z-index: 12000;
  display: none;
  background: rgba(0,0,0,0.95);
  color: var(--c-text-primary);
  padding: clamp(14px,4vw,42px);
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(5px);
}

.system-panel.open { display: flex; }

.system-card {
  width: min(100%, 900px);
  max-height: 100%;
  overflow: auto;
  text-align: center;
  border: 2px solid var(--c-red-primary);
  padding: clamp(18px,4vw,40px);
  background: linear-gradient(180deg, #0a0000 0%, #000000 100%);
  box-shadow: 0 0 30px rgba(255,0,0,0.55);
}

.system-card.red {
  border-color: #ff4040;
  background: linear-gradient(180deg, #220000 0%, #0a0000 100%);
  box-shadow: 0 0 30px rgba(255,0,0,0.45);
}

.system-card h2 {
  font-size: clamp(22px,5vw,48px);
  letter-spacing: 0.18em;
  margin-bottom: 24px;
  color: var(--c-red-bright);
  font-family: var(--font-mono);
}

.system-readout {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 12px;
  text-align: left;
  margin: 20px 0;
}

.system-readout > div {
  border: 1px solid var(--c-border);
  padding: 14px;
  background: var(--c-bg-input);
  color: var(--c-text-secondary);
}

.panel-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}

.panel-actions button, .panel-actions input {
  min-height: 44px;
  padding: 10px 16px;
  border: 1px solid var(--c-border);
  color: var(--c-text-secondary);
  background: var(--c-bg-input);
  font: 14px var(--font-mono);
  transition: var(--transition);
}

.panel-actions button:hover {
  border-color: var(--c-red-primary);
  color: #ffffff;
  box-shadow: 0 0 10px rgba(255,0,0,0.3);
}

.panel-actions input {
  width: min(100%, 430px);
}

.panel-actions input:focus {
  border-color: var(--c-red-bright);
  outline: none;
  box-shadow: 0 0 10px rgba(255,0,0,0.3);
}

#vigilanceVideo {
  display: block;
  width: min(100%, 900px);
  max-height: 70dvh;
  object-fit: contain;
  background: #000;
  border: 1px solid var(--c-border);
  border-radius: 8px;
}

/* Help Card */
.help-card {
  text-align: left;
  color: #f7dddd;
  line-height: 1.4;
}

.help-card h3 {
  margin: 0 0 8px;
  color: var(--c-red-bright);
  font: bold 16px var(--font-mono);
  letter-spacing: 2px;
  text-shadow: 0 0 8px rgba(255,0,0,0.62);
}

.help-card p { margin: 7px 0; }

.help-table {
  width: 100%;
  margin: 10px 0;
  border-collapse: collapse;
  table-layout: fixed;
  font: 13px/1.35 var(--font-mono);
  background: var(--c-bg-input);
}

.help-table th, .help-table td {
  padding: 7px 9px;
  border: 1px solid var(--c-border);
  vertical-align: top;
}

.help-table th {
  color: #ffffff;
  background: var(--c-bg-panel);
  letter-spacing: 1px;
}

.help-table th:first-child, .help-table td:first-child {
  width: 30%;
  color: var(--c-text-secondary);
  font-weight: bold;
}

.help-examples { color: #d8ffd9; }

@media (max-width: 700px) {
  .help-table { font-size: 11px; }
  .help-table th, .help-table td { padding: 6px; }
}

/* Mood Effects */
body.angry-mode {
  animation: angry-shake 0.075s linear 10, angry-color 1.8s ease-out 1;
}

body.angry-mode::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 20000;
  pointer-events: none;
  border: 5px solid rgba(255,20,0,0.9);
  background: radial-gradient(circle, transparent 38%, rgba(255,0,0,0.24) 100%);
  box-shadow: inset 0 0 75px rgba(255,0,0,0.65);
  animation: angry-overlay 0.18s steps(2,end) 6 alternate;
}

body.angry-mode .header h1 { color: #fff; text-shadow: 0 0 8px #fff, 0 0 32px #ff0000; }
body.angry-mode .scanner {
  border-color: #fff;
  box-shadow: 0 0 20px #fff, 0 0 55px #ff0000;
}

body.angry-mode .scanner-light {
  width: 85px;
  animation: scan-fast 0.18s linear infinite;
  background: radial-gradient(ellipse, #fff 0%, #ff1800 30%, transparent 75%);
  box-shadow: 0 0 36px #fff, 0 0 75px #ff0000;
}

body.angry-mode .voice-display-container {
  border-color: #ff1800;
  box-shadow: 0 0 45px rgba(255,0,0,0.95);
}

@keyframes angry-shake {
  0%,100% { transform: translate(0,0) rotate(0); }
  25% { transform: translate(-3px,2px) rotate(-0.12deg); }
  50% { transform: translate(3px,-2px) rotate(0.12deg); }
  75% { transform: translate(-2px,-1px) rotate(-0.08deg); }
}

@keyframes angry-color {
  0%,65% { filter: saturate(1.8) contrast(1.18); }
  100% { filter: none; }
}

@keyframes angry-overlay {
  from { opacity: 0.25; }
  to { opacity: 1; }
}

body.impatient-mode .scanner {
  border-color: #ffba2e;
  box-shadow: 0 0 17px rgba(255,166,0,0.9);
}

body.impatient-mode .scanner-light {
  animation: scan-fast 0.38s linear infinite;
  background: radial-gradient(ellipse, #fff3a5 0%, #ff9800 33%, transparent 75%);
  box-shadow: 0 0 26px #ffac16;
}

body.impatient-mode .header h1 {
  color: #ffd36a;
  text-shadow: 0 0 20px #ff9700;
}

body.impatient-mode .voice-display-container {
  border-color: #ffb329;
  box-shadow: 0 0 30px rgba(255,154,0,0.7);
}

@media (prefers-reduced-motion: reduce) {
  body.angry-mode { animation: angry-color 1.8s ease-out 1; }
  body.angry-mode::after { animation: none; }
}

/* Mobile Layout */
@media (max-width: 700px) {
  .command-bar {
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 8px;
    padding: 0 8px;
    margin-bottom: 8px;
  }
  .command-btn { min-height: 38px; font-size: 10px; }
  
  .voice-display-container { width: 100vw; max-width: none; margin: 0; }
  .voice-display-container k4000-voice-display { min-height: 96px; max-height: 27dvh; }
  
  .chat-area { min-height: 0; padding: 10px; gap: 8px; }
  .message { max-width: 92%; }
  
  .input-area {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 48px 48px minmax(0,1fr);
    grid-template-rows: auto auto;
    gap: 8px;
    padding: 10px;
    left: 12px;
    right: 12px;
    bottom: 12px;
  }
  
  .input-area input {
    grid-column: 1/-1;
    grid-row: 1;
    width: 100%;
    min-width: 0;
  }
  
  .input-area #mic { grid-column: 1; grid-row: 2; }
  .input-area #automic { grid-column: 2; grid-row: 2; }
  .input-area #send { grid-column: 3; grid-row: 2; width: 100%; }
  
  .audio-controls {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 8px;
  }
  
  .audio-controls .control-group { width: 100%; justify-content: center; }
  .voice-selector { display: grid; width: 100%; grid-template-columns: repeat(2, minmax(0,1fr)); }
  .voice-btn, .effect-select { min-height: 36px; min-width: 0; padding: 5px 7px; }
  .system-readout { grid-template-columns: 1fr; }
  
  .mobile-menu-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    margin-top: 7px;
    padding: 6px 16px;
    border: 1px solid var(--c-border);
    border-radius: 4px;
    background: var(--c-bg-input);
    color: var(--c-text-secondary);
    font: bold 11px var(--font-mono);
    letter-spacing: 1px;
    box-shadow: 0 0 8px rgba(255,0,0,0.3);
  }
  
  .mobile-menu-toggle[aria-expanded="true"] {
    background: var(--c-red-dark);
    border-color: var(--c-red-primary);
    color: #ffffff;
  }
  
  #commandBar, .audio-controls { display: none; }
  
  body.mobile-options-open #commandBar {
    display: grid;
  }
  
  body.mobile-options-open .audio-controls {
    display: flex;
  }
  
  body.mobile-options-open #commandBar {
    position: fixed;
    z-index: 10050;
    top: 78px;
    left: 8px;
    right: 8px;
    width: auto;
    margin: 0;
    padding: 8px;
    grid-template-columns: repeat(3, minmax(0,1fr));
    background: var(--c-bg-panel);
    border: 1px solid var(--c-border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.7);
  }
  
  body.mobile-options-open .audio-controls {
    position: fixed;
    z-index: 10050;
    top: 230px;
    left: 8px;
    right: 8px;
    width: auto;
    margin: 0;
    padding: 8px;
    background: var(--c-bg-panel);
    border: 1px solid var(--c-border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.7);
  }
  
  body.mobile-options-open .audio-controls .control-group { width: 100%; }
  body.mobile-options-open .voice-selector { grid-template-columns: repeat(2, minmax(0,1fr)); }
  
  .input-area { position: relative; z-index: 60; }
  .input-area input { min-height: 46px; font-size: 16px; }
  .input-area #mic, .input-area #automic { min-width: 48px; min-height: 48px; }
}

@media (orientation: landscape) and (max-height: 700px) {
  .voice-display-container.orientation-fullscreen { display: flex !important; width: 100vw; height: 100dvh; }
}

/* High contrast mode for bright displays */
@media (prefers-contrast: high) {
  .message.user { background: #440000; border-color: var(--c-red-bright); }
  .message.kitt { background: #110000; border-color: var(--c-border-bright); }
  .input-area input { background: #1a0000; border-color: var(--c-border-bright); }
}

/* Final welcome message styling */
.welcome-message {
  font-size: 1.1em !important;
  font-weight: bold !important;
  color: var(--c-red-bright) !important;
  text-shadow: 0 0 10px rgba(255,0,0,0.5) !important;
}
</style>
</head>
<body>

<div class="header">
  <h1>K-4000</h1>
  <div class="subtitle">PASCAL FERRON</div>
  <div class="owner-badge">PROPRIÉTAIRE</div>
  <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-expanded="false" aria-controls="mobileOptions">OPTIONS</button>
</div>

<div class="scanner-container">
  <div class="scanner" id="scanner">
    <div class="scanner-light"></div>
  </div>
</div>

<div class="command-bar" id="commandBar" aria-label="Commandes K4000">
  <button class="command-btn" id="cmdObd" type="button" title="Autoriser ou bloquer l'ouverture vocale ODB">ODB</button>
  <button class="command-btn" id="cmdMnx" type="button" title="Dossier Manix">MNX</button>
  <button class="command-btn" id="cmdDadoo" type="button" title="Dossier Dadoo">DADOO</button>
  <button class="command-btn" id="cmdNav" type="button" title="Navigation GPS">NAV</button>
  <button class="command-btn" id="cmdVol" type="button" title="Volume de la voix">VOL 100</button>
  <button class="command-btn" id="cmdVigilance" type="button" title="Surveillance caméra">VIG</button>
  <button class="command-btn active" id="cmdEqualizer" type="button" title="Afficher ou masquer l'égaliseur">EQ</button>
  <button class="command-btn" id="cmdVehicle" type="button" title="Contrôle physique du véhicule">VEHICULE</button>
  <button class="command-btn" id="cmdCommandMode" type="button" title="Verrouiller le mode commande véhicule">MODE NORMAL</button>
  <button class="command-btn" id="cmdTechnicalMode" type="button" title="Activer les connaissances Banshee, moteurs et construction">MODE TECHNIQUE</button>
  <button class="command-btn" id="cmdCulinaryMode" type="button" title="Activer les recettes, ingrédients et conseils de cuisson">MODE CUISINE</button>
</div>

<div class="mode-indicators" aria-live="polite">
  <span class="mode-indicator" id="modeNormalLamp">MODE NORMAL</span>
  <span class="mode-indicator" id="modeCommandLamp">MODE COMMANDE</span>
  <span class="mode-indicator" id="modeTechnicalLamp">MODE TECHNIQUE</span>
  <span class="mode-indicator" id="modeCulinaryLamp">MODE CUISINE</span>
</div>

<div class="voice-display-container" id="voiceDisplayContainer">
  <k4000-voice-display id="voiceDisplay"></k4000-voice-display>
  <button class="display-fullscreen-btn" id="displayFullscreen" type="button" title="Égaliseur en plein écran" aria-label="Égaliseur en plein écran">⛶</button>
</div>

<div class="chat-area" id="chat"></div>

<div class="input-area">
  <button class="mic-btn" id="mic" onclick="toggleMic()" title="Push-to-talk">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
  </button>
  <button class="auto-btn" id="automic" onclick="toggleAutoListen()" title="Auto-ecoute continue">AUTO</button>
  <input type="text" id="input" placeholder="Parlez à K-4000..." autofocus>
  <button id="send" onclick="sendMessage()">ENVOYER</button>
</div>

<div class="system-panel" id="obdPanel" role="dialog" aria-modal="true" aria-labelledby="obdTitle">
  <div class="system-card">
    <h2 id="obdTitle">ODB // VÉHICULE</h2>
    <div class="system-readout">
      <div>ÉTAT<br><strong id="obdConnected">ANALYSE...</strong></div>
      <div>INTERFACE<br><strong id="obdPort">—</strong></div>
      <div>PROTOCOLE<br><strong id="obdProtocol">—</strong></div>
      <div>SURVEILLANCE<br><strong id="obdMonitoring">—</strong></div>
    </div>
    <div class="panel-actions">
      <button type="button" onclick="closeObdPanel(false)">RÉDUIRE</button>
      <button type="button" onclick="setObdAuthorization(false)">DÉSACTIVER ODB</button>
    </div>
  </div>
</div>

<div class="system-panel" id="navPanel" role="dialog" aria-modal="true" aria-labelledby="navTitle">
  <div class="system-card">
    <h2 id="navTitle">NAVIGATION GPS</h2>
    <p>Indiquez une destination.</p>
    <div class="panel-actions">
      <input id="navDestination" type="text" placeholder="Adresse ou ville">
      <button type="button" onclick="startNavigation()">DÉMARRER</button>
      <button type="button" onclick="closePanel('navPanel')">FERMER</button>
    </div>
  </div>
</div>

<div class="system-panel" id="vigilancePanel" role="dialog" aria-modal="true" aria-labelledby="vigilanceTitle">
  <div class="system-card red">
    <h2 id="vigilanceTitle">MODE VIGILANCE</h2>
    <video id="vigilanceVideo" autoplay playsinline muted></video>
    <div class="panel-actions">
      <button type="button" onclick="stopVigilance()">DÉSACTIVER</button>
    </div>
  </div>
</div>

<div class="status-bar">
  <span id="status">Connexion...</span>
</div>

<div class="audio-controls">
  <div class="control-group">
    <span class="control-label">Voix</span>
    <div class="voice-selector" id="voiceSelector">
      <button class="voice-btn" id="voice-kitt" onclick="setVoice('kitt')">KITT</button>
      <button class="voice-btn" id="voice-guy" onclick="setVoice('guy')">Manix | Kyronext Studio</button>
      <button class="voice-btn" id="voice-manix" onclick="setVoice('manix')">Manix</button>
      <button class="voice-btn" id="voice-english" onclick="setVoice('english')">English</button>
    </div>
  </div>
  <label class="control-group" for="voiceEffect">
    <span class="control-label">Effet vocal</span>
    <select class="effect-select" id="voiceEffect" onchange="setVoiceEffect(this.value)">
      <option value="none">Aucun</option>
      <option value="kitt_classic">KITT Classic</option>
      <option value="karr_classic">KARR Classic</option>
      <option value="studio">Studio</option>
    </select>
  </label>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const scanner = document.getElementById('scanner');
const voiceDisplay = document.getElementById('voiceDisplay');
const voiceDisplayContainer = document.getElementById('voiceDisplayContainer');
const displayFullscreenBtn = document.getElementById('displayFullscreen');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const sessionId = 'kitt-' + Date.now();
let audioCtx = null;
let isRecording = false;
let micStream = null;
let micProcessor = null;
let micContext = null;
let pcmChunks = [];
const micBtn = document.getElementById('mic');
const autoBtn = document.getElementById('automic');
const mobileMenuToggle = document.getElementById('mobileMenuToggle');
mobileMenuToggle?.addEventListener('click', () => {
  const open = document.body.classList.toggle('mobile-options-open');
  mobileMenuToggle.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', (event) => {
  if (!document.body.classList.contains('mobile-options-open')) return;
  if (event.target.closest('#mobileMenuToggle, #commandBar, .audio-controls')) return;
  document.body.classList.remove('mobile-options-open');
  mobileMenuToggle?.setAttribute('aria-expanded', 'false');
});
const cmdObd = document.getElementById('cmdObd');
const cmdVol = document.getElementById('cmdVol');
const cmdVigilance = document.getElementById('cmdVigilance');
const cmdEqualizer = document.getElementById('cmdEqualizer');
const cmdCommandMode = document.getElementById('cmdCommandMode');
const cmdTechnicalMode = document.getElementById('cmdTechnicalMode');
const cmdCulinaryMode = document.getElementById('cmdCulinaryMode');
const modeNormalLamp = document.getElementById('modeNormalLamp');
const modeCommandLamp = document.getElementById('modeCommandLamp');
const modeTechnicalLamp = document.getElementById('modeTechnicalLamp');
const modeCulinaryLamp = document.getElementById('modeCulinaryLamp');
let vehicleModeStatus = {active:false, manually_locked:false, mode:'normal'};
let technicalModeStatus = {active:false, mode:'normal'};
let culinaryModeStatus = {active:false, mode:'normal'};
let landscapeFullscreenDismissed = false;
let equalizerEnabled = localStorage.getItem('k4000.equalizer') !== 'off';
let obdAutoEnabled = localStorage.getItem('k4000.obdAuto') === 'on';
let playbackVolume = Number(localStorage.getItem('k4000.volume') || '1');
let vigilanceStream = null;

function displayIsFullscreen() {
  return document.fullscreenElement === voiceDisplayContainer ||
    document.webkitFullscreenElement === voiceDisplayContainer ||
    voiceDisplayContainer.classList.contains('pseudo-fullscreen') ||
    voiceDisplayContainer.classList.contains('orientation-fullscreen');
}

function syncVoiceDisplayFullscreen() {
  const active = displayIsFullscreen();
  voiceDisplay.toggleAttribute('fullscreen', active);
  displayFullscreenBtn.textContent = active ? '✕' : '⛶';
  requestAnimationFrame(() => voiceDisplay.resize?.());
}

async function toggleVoiceDisplayFullscreen() {
  if (voiceDisplayContainer.classList.contains('orientation-fullscreen')) {
    landscapeFullscreenDismissed = true;
    voiceDisplayContainer.classList.remove('orientation-fullscreen');
  } else if (displayIsFullscreen()) {
    if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
    else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
    else voiceDisplayContainer.classList.remove('pseudo-fullscreen');
  } else if (voiceDisplayContainer.requestFullscreen) {
    await voiceDisplayContainer.requestFullscreen();
  } else if (voiceDisplayContainer.webkitRequestFullscreen) {
    voiceDisplayContainer.webkitRequestFullscreen();
  } else {
    voiceDisplayContainer.classList.add('pseudo-fullscreen');
  }
  syncVoiceDisplayFullscreen();
}

displayFullscreenBtn.addEventListener('click', toggleVoiceDisplayFullscreen);
document.addEventListener('fullscreenchange', syncVoiceDisplayFullscreen);
document.addEventListener('webkitfullscreenchange', syncVoiceDisplayFullscreen);

function syncLandscapeFullscreen() {
  const viewportWidth = window.visualViewport?.width || window.innerWidth;
  const viewportHeight = window.visualViewport?.height || window.innerHeight;
  const landscapePhone = viewportWidth > viewportHeight && viewportHeight <= 700;
  if (!landscapePhone) landscapeFullscreenDismissed = false;
  const enabled = equalizerEnabled && landscapePhone && !landscapeFullscreenDismissed;
  voiceDisplayContainer.classList.toggle('orientation-fullscreen', enabled);
  syncVoiceDisplayFullscreen();
}

window.addEventListener('orientationchange', () => setTimeout(syncLandscapeFullscreen, 120));
window.addEventListener('resize', syncLandscapeFullscreen);
window.visualViewport?.addEventListener('resize', syncLandscapeFullscreen);
screen.orientation?.addEventListener?.('change', syncLandscapeFullscreen);

function updateCommandButtons() {
  cmdObd.classList.toggle('active', obdAutoEnabled);
  cmdObd.setAttribute('aria-pressed', String(obdAutoEnabled));
  cmdEqualizer.classList.toggle('active', equalizerEnabled);
  cmdEqualizer.setAttribute('aria-pressed', String(equalizerEnabled));
  cmdVol.textContent = playbackVolume === 0 ? 'VOL OFF' : `VOL ${Math.round(playbackVolume * 100)}`;
}

function setObdAuthorization(enabled) {
  obdAutoEnabled = Boolean(enabled);
  localStorage.setItem('k4000.obdAuto', obdAutoEnabled ? 'on' : 'off');
  updateCommandButtons();
  if (obdAutoEnabled) openObdPanel(); else closeObdPanel(true);
  statusEl.innerHTML = `<span class="online">ODB automatique ${obdAutoEnabled ? 'autorisé' : 'bloqué'}</span>`;
}

async function openObdPanel() {
  if (!obdAutoEnabled) return;
  document.getElementById('obdPanel').classList.add('open');
  try {
    const data = await (await fetch('/api/obd')).json();
    document.getElementById('obdConnected').textContent = data.connected ? 'CONNECTÉ' : 'EN ATTENTE';
    document.getElementById('obdPort').textContent = data.port || 'AUCUNE';
    document.getElementById('obdProtocol').textContent = data.protocol || '—';
    document.getElementById('obdMonitoring').textContent = data.monitoring || '—';
  } catch { document.getElementById('obdConnected').textContent = 'INDISPONIBLE'; }
}
function closeObdPanel(disable) {
  document.getElementById('obdPanel').classList.remove('open');
  if (disable && obdAutoEnabled) {
    obdAutoEnabled = false;
    localStorage.setItem('k4000.obdAuto', 'off');
    updateCommandButtons();
  }
}
function closePanel(id) { document.getElementById(id).classList.remove('open'); }

function toggleEqualizer() {
  equalizerEnabled = !equalizerEnabled;
  localStorage.setItem('k4000.equalizer', equalizerEnabled ? 'on' : 'off');
  voiceDisplayContainer.classList.toggle('display-disabled', !equalizerEnabled);
  if (!equalizerEnabled) {
    voiceDisplayContainer.classList.remove('orientation-fullscreen', 'pseudo-fullscreen');
    if (document.fullscreenElement === voiceDisplayContainer && document.exitFullscreen) document.exitFullscreen();
  }
  updateCommandButtons();
  syncLandscapeFullscreen();
}

function cycleVolume() {
  const levels = [1, 0.7, 0.35, 0];
  const current = levels.findIndex(v => Math.abs(v - playbackVolume) < 0.01);
  playbackVolume = levels[(current + 1) % levels.length];
  localStorage.setItem('k4000.volume', String(playbackVolume));
  voiceDisplay.setOutputVolume?.(playbackVolume);
  updateCommandButtons();
}

async function toggleVigilance() {
  if (vigilanceStream) { stopVigilance(); return; }
  try {
    vigilanceStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    document.getElementById('vigilanceVideo').srcObject = vigilanceStream;
    document.getElementById('vigilancePanel').classList.add('open');
    cmdVigilance.classList.add('active');
  } catch (error) {
    statusEl.innerHTML = `<span class="offline">Caméra indisponible: ${error.message}</span>`;
  }
}
function stopVigilance() {
  if (vigilanceStream) vigilanceStream.getTracks().forEach(track => track.stop());
  vigilanceStream = null;
  document.getElementById('vigilanceVideo').srcObject = null;
  document.getElementById('vigilancePanel').classList.remove('open');
  cmdVigilance.classList.remove('active');
}
function startNavigation() {
  const destination = document.getElementById('navDestination').value.trim();
  if (!destination) return;
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}`, '_blank', 'noopener');
}

document.getElementById('cmdObd').addEventListener('click', () => setObdAuthorization(!obdAutoEnabled));
document.getElementById('cmdMnx').addEventListener('click', () => { window.location.href = '/mnx'; });
document.getElementById('cmdDadoo').addEventListener('click', () => { window.location.href = '/dadoo'; });
document.getElementById('cmdNav').addEventListener('click', () => document.getElementById('navPanel').classList.add('open'));
document.getElementById('cmdVol').addEventListener('click', cycleVolume);
document.getElementById('cmdVigilance').addEventListener('click', toggleVigilance);
document.getElementById('cmdEqualizer').addEventListener('click', toggleEqualizer);
document.getElementById('cmdVehicle').addEventListener('click', () => { window.location.href = '/vehicle-control'; });
cmdCommandMode.addEventListener('click', toggleManualCommandMode);
cmdTechnicalMode.addEventListener('click', toggleTechnicalMode);
cmdCulinaryMode.addEventListener('click', toggleCulinaryMode);
voiceDisplayContainer.classList.toggle('display-disabled', !equalizerEnabled);
updateCommandButtons();
refreshVehicleMode();
refreshTechnicalMode();
refreshCulinaryMode();
setInterval(refreshVehicleMode, 5000);
setInterval(refreshTechnicalMode, 5000);
setInterval(refreshCulinaryMode, 5000);
syncLandscapeFullscreen();

function renderVehicleMode(data) {
  vehicleModeStatus = data;
  const locked = !!data.manually_locked;
  const active = !!data.active;
  cmdCommandMode.textContent = locked ? 'MODE COMMANDE VERROUILLÉ' : (active ? 'MODE COMMANDE 5 MIN' : 'MODE NORMAL');
  cmdCommandMode.classList.toggle('mode-locked', locked);
  cmdCommandMode.classList.toggle('active', active && !locked);
  modeNormalLamp.classList.toggle('active', !active && !technicalModeStatus.active && !culinaryModeStatus.active);
  modeCommandLamp.classList.toggle('active', active);
}

async function refreshVehicleMode() {
  try {
    const res = await fetch('/api/vehicle/mode?session_id=' + encodeURIComponent(sessionId));
    if (res.ok) renderVehicleMode(await res.json());
  } catch (error) {
    console.warn('vehicle mode status', error);
  }
}

async function toggleManualCommandMode() {
  const locked = !vehicleModeStatus.manually_locked;
  try {
    const res = await fetch('/api/vehicle/mode', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sessionId, locked}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    renderVehicleMode(data);
    statusEl.innerHTML = locked
      ? '<span class="online">MODE COMMANDE verrouillé sans timeout.</span>'
      : '<span class="online">MODE NORMAL.</span>';
  } catch (error) {
    statusEl.innerHTML = '<span class="offline">Mode commande: ' + error.message + '</span>';
  }
}

function renderTechnicalMode(data) {
  technicalModeStatus = data;
  const active = !!data.active;
  cmdTechnicalMode.textContent = active ? 'MODE TECHNIQUE ACTIF' : 'MODE TECHNIQUE';
  cmdTechnicalMode.classList.toggle('active', active);
  cmdTechnicalMode.setAttribute('aria-pressed', String(active));
  modeTechnicalLamp.classList.toggle('active', active);
  modeNormalLamp.classList.toggle('active', !vehicleModeStatus.active && !active && !culinaryModeStatus.active);
}

async function refreshTechnicalMode() {
  try {
    const res = await fetch('/api/technical/mode?session_id=' + encodeURIComponent(sessionId));
    if (res.ok) renderTechnicalMode(await res.json());
  } catch (error) {
    console.warn('technical mode status', error);
  }
}

async function toggleTechnicalMode() {
  const active = !technicalModeStatus.active;
  try {
    const res = await fetch('/api/technical/mode', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sessionId, active}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    renderTechnicalMode(data);
    if (active) refreshCulinaryMode();
    statusEl.innerHTML = active
      ? '<span class="online">MODE TECHNIQUE actif : Banshee, moteurs et construction.</span>'
      : '<span class="online">MODE TECHNIQUE désactivé.</span>';
  } catch (error) {
    statusEl.innerHTML = '<span class="offline">Mode technique: ' + error.message + '</span>';
  }
}

function renderCulinaryMode(data) {
  culinaryModeStatus = data;
  const active = !!data.active;

const audioQueue = [];
let isPlayingAudio = false;

async function playNextAudio() {
  if (isPlayingAudio || audioQueue.length === 0) return;
  isPlayingAudio = true;
  const url = audioQueue.shift();
  try {
    // Un onglet masque ne doit jamais doubler la voix de l onglet visible.
    if (document.hidden) return;

    if (navigator.locks && navigator.locks.request) {
      // Verrou partage par tous les onglets Chromium de cette origine.
      // ifAvailable evite qu un second onglet rejoue le meme segment ensuite.
      await navigator.locks.request("kyronext-audio-output",
        { mode: "exclusive", ifAvailable: true },
        async lock => {
          if (lock && !document.hidden) await playAudio(url);
        });
    } else {
      await playAudio(url);
    }
  } finally {
    isPlayingAudio = false;
    playNextAudio();
  }
}

async function streamChat(msg) {
  const div = document.createElement('div');
  div.className = 'message kitt';
  div.innerHTML = '<span class="typing">...</span>';
  chat.appendChild(div);

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: msg, session_id: sessionId, audio: true, obd_auto: obdAutoEnabled })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let text = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.token) {
              text += data.token;
              div.innerHTML = text;
              chat.scrollTop = chat.scrollHeight;
            }
            if (data.audio_chunk) {
              audioQueue.push(data.audio_chunk);
              playNextAudio();
            }
            if (data.done && data.timing) {
              div.innerHTML = text + `<div class="timing">LLM: ${data.timing.llm_ms}ms | TTS: ${data.timing.tts_ms || 0}ms</div>`;
              if (data.action === 'obd_fullscreen' && obdAutoEnabled) openObdPanel();
              if (data.action === 'bonnie_unlock') playBonnieUnlockSound();
              if (data.action === 'mode_activated' || data.action === 'mode_deactivated') refreshVehicleMode();
              if (data.action === 'technical_mode_activated' || data.action === 'technical_mode_deactivated') { refreshTechnicalMode(); refreshCulinaryMode(); }
              if (data.action === 'culinary_mode_activated' || data.action === 'culinary_mode_deactivated') { refreshCulinaryMode(); refreshTechnicalMode(); }
              if (data.action === 'repeated_question_impatient') triggerImpatientMode();
              if (data.action === 'repeated_question_warning') triggerAngryMode();
              if (data.action === 'repeated_question_reconciled') clearMoodEffects();
            }
          } catch {}
        }
      }
    }
  } catch (e) {
    div.innerHTML = 'Erreur de connexion au serveur.';
  }
  sendBtn.disabled = false;
  input.focus();
}

let playbackCtx = null;
function ensurePlaybackCtx() {
  if (!playbackCtx || playbackCtx.state === 'closed') {
    playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (playbackCtx.state === 'suspended') playbackCtx.resume();
  return playbackCtx;
}
function playListeningCue() {
  try {
    const ctx = ensurePlaybackCtx();
    const now = ctx.currentTime + 0.01;
    const gain = ctx.createGain();
    const oscillator = ctx.createOscillator();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(720, now);
    oscillator.frequency.exponentialRampToValueAtTime(920, now + 0.07);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.025, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start(now);
    oscillator.stop(now + 0.095);
  } catch (error) {
    console.warn('listening_cue', error);
  }
}

function playBonnieUnlockSound() {
  try {
    const ctx = ensurePlaybackCtx();
    const now = ctx.currentTime + 0.01;
    const output = ctx.createGain();
    output.gain.setValueAtTime(0.0001, now);
    output.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
    output.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2200, now);
    filter.Q.value = 3;

    const oscA = ctx.createOscillator();
    oscA.type = 'sawtooth';
    oscA.frequency.setValueAtTime(220, now);
    oscA.frequency.exponentialRampToValueAtTime(640, now + 0.12);

    const oscB = ctx.createOscillator();
    oscB.type = 'square';
    oscB.frequency.setValueAtTime(1100, now);
    oscB.frequency.exponentialRampToValueAtTime(360, now + 0.18);

    oscA.connect(filter);
    oscB.connect(filter);
    filter.connect(output);
    output.connect(ctx.destination);

    oscA.start(now);
    oscB.start(now + 0.015);
    oscA.stop(now + 0.24);
    oscB.stop(now + 0.22);
  } catch (error) {
    console.warn('bonnie_unlock_sound', error);
  }
}

// Unlock audio on any user interaction
['click', 'touchstart', 'keydown'].forEach(evt =>

function playAudio(url) {
  return new Promise((resolve) => {
    scanner.classList.add('speaking');
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      scanner.classList.remove('speaking');
      resolve();
    };

    const ctx = ensurePlaybackCtx();
    fetch(url)
      .then(r => {
        if (!r.ok) throw new Error('Audio HTTP ' + r.status);
        return r.arrayBuffer();
      })
      .then(buf => ctx.decodeAudioData(buf))
      .then(decoded => {
        const src = ctx.createBufferSource();
        src.buffer = decoded;
        voiceDisplay.setOutputVolume?.(playbackVolume);
        voiceDisplay.connectSource(src, ctx);
        src.onended = () => { voiceDisplay.releaseSource(); finish(); };
        src.start(0);
      })
      .catch(() => {
        const audio = new Audio(url);
        audio.volume = playbackVolume;
        audio.onended = finish;
        audio.onerror = finish;
        audio.play().catch(finish);
      });
  });
}

function encodeWAV(samples, sampleRate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buf);
  function writeStr(off, s) { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

async function sendToSTT(chunks, sampleRate) {
  const allSamples = new Float32Array(chunks.reduce((a, b) => a + b.length, 0));
  let offset = 0;
  for (const chunk of chunks) { allSamples.set(chunk, offset); offset += chunk.length; }

  const wavBlob = encodeWAV(allSamples, sampleRate);
  statusEl.innerHTML = '<span class="online">Transcription... (' + (wavBlob.size/1024).toFixed(0) + ' Ko)</span>';

  const formData = new FormData();
  formData.append('audio', wavBlob, 'recording.wav');

  const res = await fetch('/api/stt', { method: 'POST', body: formData });
  return await res.json();
}

async function handleSTTResult(data) {
  if (data.text && data.text.trim()) {
    const text = data.text.trim();
    addMessage(text, 'user', null);
    statusEl.innerHTML = `<span class="online">STT: ${data.stt_ms}ms</span>`;
    sendBtn.disabled = true;
    await streamChat(text);
    return true;
  }
  return false;
}

// ── Mode 1: Push-to-talk ──────────────────────────────────────

async function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.classList.add('transcribing');
  scanner.classList.remove('listening');

  if (micProcessor) micProcessor.disconnect();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micContext) micContext.close();

  try {
    const data = await sendToSTT(pcmChunks, 16000);
    if (!await handleSTTResult(data)) {
      statusEl.innerHTML = '<span class="offline">Rien entendu — parlez plus fort</span>';
    }
  } catch (e) {
    statusEl.innerHTML = '<span class="offline">Erreur STT</span>';
  }
  micBtn.classList.remove('transcribing');
}

async function toggleMic() {
  if (autoListenActive) stopAutoListen();
  if (isRecording) { stopRecording(); return; }

  try {
    statusEl.innerHTML = '<span class="online">Demande micro...</span>';
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true } });

    micContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const source = micContext.createMediaStreamSource(micStream);
    micProcessor = micContext.createScriptProcessor(4096, 1, 1);
    pcmChunks = [];

    micProcessor.onaudioprocess = (e) => {
      if (isRecording) pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    };

    source.connect(micProcessor);
    micProcessor.connect(micContext.destination);

    playListeningCue();
    await new Promise(r => setTimeout(r, 100));
    isRecording = true;
    micBtn.classList.add('recording');
    scanner.classList.add('listening');
    statusEl.innerHTML = '<span class="online">Ecoute en cours...</span>';
  } catch (e) {
    statusEl.innerHTML = '<span class="offline">Micro refuse: ' + e.message + '. Si tu es en HTTP sur une IP locale, ouvre https://' + window.location.host + ' et accepte le certificat auto-signe.</span>';
  }
}

// ── Mode 2: Auto-ecoute continue (VAD) ───────────────────────

function stopAutoListen() {
  autoListenActive = false;
  isSpeaking = false;
  autoProcessing = false;
  if (autoProcessor) autoProcessor.disconnect();
  if (autoStream) autoStream.getTracks().forEach(t => t.stop());
  if (autoContext) autoContext.close();
  autoBtn.classList.remove('active', 'waiting', 'hearing', 'transcribing');
  scanner.classList.remove('auto-listening', 'auto-hearing');
  statusEl.innerHTML = '<span class="online">Auto-ecoute arretee</span>';
}

async function processAutoSpeech() {
  if (autoPcmChunks.length === 0) return;
  autoProcessing = true;
  autoBtn.classList.remove('hearing');
  autoBtn.classList.add('transcribing');
  scanner.classList.remove('auto-hearing');

  const chunks = autoPcmChunks.slice();
  autoPcmChunks = [];

  try {
    const data = await sendToSTT(chunks, 16000);
    if (await handleSTTResult(data)) {
      // Attendre la fin réelle de toute la file audio avant de rouvrir le micro.
      await new Promise(r => {
        const started = Date.now();
        const check = setInterval(() => {
          const audioFinished = !isPlayingAudio && audioQueue.length === 0 && !scanner.classList.contains('speaking');
          if (audioFinished || Date.now() - started > 30000) { clearInterval(check); r(); }
        }, 100);
      });
      // Court garde anti-écho, nettement plus rapide que l'ancien délai de 1,5 s.
      await new Promise(r => setTimeout(r, 350));
    }
  } catch (e) {
    statusEl.innerHTML = '<span class="offline">Erreur STT</span>';
  }

  // Reset VAD state cleanly before resuming
  isSpeaking = false;
  silenceStart = 0;
  autoPcmChunks = [];
  autoBtn.classList.remove('transcribing');
  if (autoListenActive) {
    playListeningCue();
    await new Promise(r => setTimeout(r, 100));
    autoProcessing = false;
    autoBtn.classList.add('active', 'waiting');
    scanner.classList.add('auto-listening');
    statusEl.innerHTML = '<span class="online">Auto-ecoute: en attente...</span>';
  }
}

async function toggleAutoListen() {
  if (isRecording) stopRecording();
  if (autoListenActive) { stopAutoListen(); return; }

  try {
    statusEl.innerHTML = '<span class="online">Demande micro...</span>';
    autoStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true } });

    autoContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const source = autoContext.createMediaStreamSource(autoStream);

    autoAnalyser = autoContext.createAnalyser();
    autoAnalyser.fftSize = 2048;
    source.connect(autoAnalyser);

    autoProcessor = autoContext.createScriptProcessor(4096, 1, 1);
    autoPcmChunks = [];
    isSpeaking = false;
    silenceStart = 0;
    speechStart = 0;

    autoProcessor.onaudioprocess = (e) => {
      if (!autoListenActive || autoProcessing) return;
      const buf = new Float32Array(autoAnalyser.fftSize);
      autoAnalyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      const now = Date.now();

      if (rms > VAD_THRESHOLD) {
        if (!isSpeaking) {
          isSpeaking = true;
          speechStart = now;
          autoPcmChunks = [];
          autoBtn.classList.remove('waiting');
          autoBtn.classList.add('hearing');
          scanner.classList.remove('auto-listening');
          scanner.classList.add('auto-hearing');
          statusEl.innerHTML = '<span class="online">Parole detectee...</span>';
        }
        silenceStart = 0;
        autoPcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      } else if (isSpeaking) {
        autoPcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
        if (!silenceStart) silenceStart = now;
        if (now - silenceStart > SILENCE_DURATION) {
          isSpeaking = false;
          if (now - speechStart > MIN_SPEECH_DURATION) {
            processAutoSpeech();
          } else {
            autoPcmChunks = [];
            autoBtn.classList.remove('hearing');
            autoBtn.classList.add('waiting');
            scanner.classList.remove('auto-hearing');
            scanner.classList.add('auto-listening');
            statusEl.innerHTML = '<span class="online">Auto-ecoute: en attente...</span>';
          }
        }
      }
    };

    source.connect(autoProcessor);
    autoProcessor.connect(autoContext.destination);

    playListeningCue();
    await new Promise(r => setTimeout(r, 100));
    autoListenActive = true;
    autoBtn.classList.add('active', 'waiting');
    scanner.classList.add('auto-listening');
    statusEl.innerHTML = '<span class="online">Auto-ecoute: en attente...</span>';
  } catch (e) {
    statusEl.innerHTML = '<span class="offline">Micro refuse: ' + e.message + '. Si tu es en HTTP sur une IP locale, ouvre https://' + window.location.host + ' et accepte le certificat auto-signe.</span>';
  }
}
